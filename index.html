<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>听写助手 Pro - 全栈版</title>
  <style>
    :root { --primary: #e94560; --bg: #1a1a2e; --card: #16213e; --text: #eee; --accent: #0f3460; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: var(--bg); color: var(--text); padding-bottom: 100px; transition: filter 0.3s; }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    h1 { text-align: center; color: var(--primary); margin-bottom: 20px; }

    /* 登录样式 */
    #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
    .login-box { background: var(--card); padding: 40px; border-radius: 16px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid #333; }
    .login-box h2 { margin-bottom: 25px; color: var(--primary); font-size: 1.8rem; }
    .login-box input { width: 100%; padding: 14px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #333; background: #1a1a2e; color: white; font-size: 1rem; }
    
    /* 页面禁用状态 */
    body.not-logged-in { overflow: hidden; }
    body.not-logged-in .main-content { filter: grayscale(1) blur(5px); pointer-events: none; opacity: 0.5; }

    /* 顶部栏 */
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--card); padding: 10px 20px; border-radius: 10px; }
    .user-info { font-size: 0.95rem; color: #aaa; display: flex; align-items: center; gap: 10px; }
    .admin-tag { background: #ffd700; color: #000; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }

    /* 视频控制 */
    .video-section { margin-bottom: 25px; }
    .link-section { display: flex; gap: 10px; margin-bottom: 15px; }
    .link-section input { flex: 1; padding: 12px 15px; border-radius: 8px; border: 1px solid #333; background: var(--card); color: white; font-size: 1rem; }
    .video-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* 记录列表 */
    .results-container { background: var(--card); border-radius: 12px; border: 1px solid #333; margin-top: 20px; display: flex; flex-direction: column; height: 350px; }
    .results-header { padding: 10px 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); }
    .results-display { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    
    .record-item { background: rgba(255,255,255,0.03); padding: 8px 12px; border-radius: 6px; border-left: 3px solid var(--primary); position: relative; animation: slideIn 0.2s ease-out; display: flex; gap: 12px; align-items: flex-start; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-5px); } to { opacity: 1; transform: translateX(0); } }
    
    .record-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .record-meta { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; }
    .record-index { background: var(--primary); color: white; padding: 1px 6px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; }
    .record-time { cursor: pointer; color: var(--primary); font-weight: bold; }
    
    .record-actions-col { display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center; min-width: 30px; }
    .action-btn { cursor: pointer; font-size: 1.1rem; transition: transform 0.2s; background: none; border: none; padding: 0; line-height: 1; display: flex; align-items: center; justify-content: center; }
    .action-btn:hover { transform: scale(1.2); }
    
    /* 文字编辑 */
    .manual-text { width: 100%; background: transparent; border: none; color: #ccc; font-size: 0.95rem; line-height: 1.4; resize: none; padding: 0; transition: 0.2s; border-bottom: 1px solid transparent; }
    .manual-text:focus { color: #fff; border-bottom-color: var(--primary); outline: none; }

    /* 底部控制栏 */
    .controls-footer { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card); padding: 20px; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); z-index: 100; border-top: 1px solid #333; }
    .input-area { max-width: 900px; margin: 0 auto; display: flex; gap: 15px; align-items: stretch; }
    
    .mic-container { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .mic-btn { width: 80px; height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--accent); border: none; border-radius: 50%; cursor: pointer; transition: 0.3s; color: white; position: relative; }
    .mic-btn.recording { background: var(--primary); animation: pulse 1.5s infinite; }
    .mic-icon { font-size: 32px; }
    .mic-status-text { font-size: 11px; color: #aaa; }
    
    .progress-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; border: 4px solid transparent; border-top-color: #fff; animation: spin 2s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .mic-btn.recording .progress-overlay { display: block; }
    
    .text-box { flex: 1; display: flex; flex-direction: column; gap: 10px; }
    #manualInput { height: 80px; background: #1a1a2e; color: white; border: 1px solid #444; border-radius: 10px; padding: 12px; resize: none; font-size: 1.1rem; }
    
    .btn-main { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.2s; }
    .btn-main:hover { background: #ff5e78; transform: translateY(-2px); }
    .btn-main:active { transform: translateY(0); }

    /* 管理后台 */
    #adminPanel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 1500; padding: 30px; overflow-y: auto; display: none; }
    .admin-card { background: var(--card); padding: 25px; border-radius: 16px; border: 1px solid #333; margin-bottom: 30px; }
    .user-list { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--card); border-radius: 12px; overflow: hidden; }
    .user-list th { background: #0f3460; color: #fff; padding: 15px; text-align: left; }
    .user-list td { padding: 15px; border-bottom: 1px solid #333; }
    .user-list tr:hover { background: rgba(255,255,255,0.05); }

    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(233, 69, 96, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(233, 69, 96, 0); } 100% { box-shadow: 0 0 0 0 rgba(233, 69, 96, 0); } }
    
    @media (max-width: 768px) {
      .input-area { flex-direction: column; }
      .mic-container { flex-direction: row; width: 100%; justify-content: center; }
      .mic-btn { width: 60px; height: 60px; }
      .mic-icon { font-size: 24px; }
      #manualInput { height: 100px; }
      .controls-footer { padding: 15px; }
    }
  </style>
</head>
<body class="not-logged-in">

<!-- 登录遮罩 -->
<div id="loginOverlay">
  <div class="login-box">
    <h2>� 听写助手 Pro</h2>
    <input type="text" id="loginUser" placeholder="用户名/邮箱" value="yqcw@qq.com">
    <input type="password" id="loginPass" placeholder="密码" value="123456">
    <button class="btn-main" style="width: 100%" onclick="handleLogin()">登录系统</button>
    <p id="loginMsg" style="color: #ff6b7a; margin-top: 15px; font-size: 0.9rem; min-height: 1.2rem;"></p>
  </div>
</div>

<!-- 管理后台 -->
<div id="adminPanel">
  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
      <h2>👥 用户管理后台</h2>
      <button class="btn-main" style="background: #444" onclick="closeAdmin()">返回听写</button>
    </div>
    
    <div class="admin-card">
      <h3>新增 / 编辑用户</h3>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 15px;">
        <input type="hidden" id="editUserId">
        <input type="text" id="editUsername" placeholder="用户名" style="padding: 12px; border-radius: 8px; background: #1a1a2e; color: white; border: 1px solid #444;">
        <input type="text" id="editPassword" placeholder="登录密码" style="padding: 12px; border-radius: 8px; background: #1a1a2e; color: white; border: 1px solid #444;">
        <select id="editIsAdmin" style="padding: 12px; border-radius: 8px; background: #1a1a2e; color: white; border: 1px solid #444;">
          <option value="0">普通用户</option>
          <option value="1">管理员权限</option>
        </select>
        <button class="btn-main" onclick="saveUser()">保存用户信息</button>
      </div>
    </div>

    <table class="user-list" id="userTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>用户名</th>
          <th>密码</th>
          <th>身份</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- 主内容区 -->
<div class="main-content">
  <div class="container">
    <div class="top-bar">
      <div class="user-info" id="userInfo">未登录</div>
      <div style="display: flex; gap: 10px; align-items: center;">
        <label style="font-size: 0.8rem; color: #888; cursor: pointer; display: flex; align-items: center; gap: 5px;">
          <input type="checkbox" id="continuousPlayToggle" onchange="toggleContinuous(this.checked)"> 连续播放
        </label>
        <div id="adminLink" style="display: none;">
          <button class="btn-secondary" onclick="openAdmin()" style="background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;">管理后台</button>
        </div>
        <button onclick="handleLogout()" style="background: none; border: 1px solid #444; color: #888; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem;">退出</button>
      </div>
    </div>

    <h1>🎧 听写助手 Pro</h1>

    <div class="video-section">
      <div class="link-section">
        <input type="text" id="videoUrl" placeholder="粘贴 YouTube 视频链接 (例如: https://www.youtube.com/watch?v=...)">
        <button class="btn-main" onclick="loadVideo()">加载视频</button>
      </div>
      <div class="video-wrapper"><div id="player"></div></div>
    </div>

    <div class="results-container">
      <div class="results-header">
        <div style="font-weight: bold; color: var(--primary);">📜 听写片段</div>
        <div style="display: flex; gap: 10px;">
          <button id="playAllBtn" class="btn-secondary" onclick="playAllRecords()" style="font-size: 0.8rem; padding: 4px 8px; background: var(--accent); color: white; border: none; border-radius: 4px; cursor: pointer;">▶️ 全部播放</button>
          <button id="pauseAllBtn" class="btn-secondary" onclick="pauseAllRecords()" style="font-size: 0.8rem; padding: 4px 8px; background: #444; color: white; border: none; border-radius: 4px; cursor: pointer; display: none;">⏸️ 停止</button>
        </div>
      </div>
      <div id="resultsDisplay" class="results-display"></div>
    </div>
  </div>

  <div class="controls-footer">
    <div class="input-area">
      <div class="mic-container">
        <button id="micBtn" class="mic-btn" onclick="toggleRecording()">
          <div class="progress-overlay"></div>
          <span class="mic-icon">🎤</span>
        </button>
        <span id="micStatus" class="mic-status-text">点击录音 (R)</span>
      </div>
      
      <div class="text-box">
        <textarea id="manualInput" placeholder="录完音后在此输入文字，按 Enter 提交记录..."></textarea>
        <div style="display: flex; justify-content: flex-end;">
          <button class="btn-main" onclick="submitEntry()">提交记录 (Enter)</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const API_BASE = '/api';
  let player, mediaRecorder, recordingStartTime;
  let audioChunks = [];
  let isRecording = false;
  let currentUser = null;
  let videoId = null;
  let videoTitle = "";
  let historyRecords = [];
  let isContinuousPlaying = false;

  // --- YouTube API ---
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  function loadVideo() {
    const url = document.getElementById('videoUrl').value;
    const vid = url.match(/(?:v=|be\/|embed\/)([a-zA-Z0-9_-]{11})/)?.[1];
    if (!vid) return alert("请输入有效的 YouTube 链接");
    videoId = vid;
    if (player) player.destroy();
    player = new YT.Player('player', {
      videoId: vid,
      events: {
        'onReady': (event) => {
          videoTitle = event.target.getVideoData().title || "未命名视频";
          loadHistory();
        }
      }
    });
  }

  // --- 权限管理 ---
  async function handleLogin() {
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value.trim();
    const msg = document.getElementById('loginMsg');
    if (!username || !password) return msg.innerText = "请输入账号和密码";

    try {
      const res = await fetch(`${API_BASE}/user`, {
        method: 'POST',
        body: JSON.stringify({ action: 'login', username, password })
      });
      const data = await res.json();
      if (res.ok) {
        currentUser = data;
        document.body.classList.remove('not-logged-in');
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('userInfo').innerHTML = `👤 ${data.username} ${data.is_admin ? '<span class="admin-tag">管理员</span>' : ''}`;
        if (data.is_admin) document.getElementById('adminLink').style.display = 'block';
      } else {
        msg.innerText = data.error || "登录失败";
      }
    } catch (e) {
      msg.innerText = "网络连接失败";
    }
  }

  function handleLogout() {
    currentUser = null;
    document.body.classList.add('not-logged-in');
    document.getElementById('loginOverlay').style.display = 'flex';
    document.getElementById('resultsDisplay').innerHTML = "";
    if (player) player.stopVideo();
  }

  // --- 录音逻辑 ---
  let currentAudio = null;

  async function toggleRecording() {
    if (!currentUser) return;
    isRecording ? stopRecording() : startRecording();
  }

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      recordingStartTime = Date.now();
      
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = async () => {
        const blob = new Blob(audioChunks, { type: 'audio/mpeg' });
        const duration = Math.round((Date.now() - recordingStartTime) / 1000);
        
        if (currentUser.replaceId) {
          const formData = new FormData();
          formData.append('file', blob, `rec-${Date.now()}.mp3`);
          if (currentUser.replaceKey) formData.append('existingKey', currentUser.replaceKey);
          
          const upRes = await fetch(`${API_BASE}/save`, { method: 'POST', body: formData });
          const upData = await upRes.json();
          
          const record = historyRecords.find(r => r.id === currentUser.replaceId);
          await fetch(`${API_BASE}/save`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              id: currentUser.replaceId,
              text: record.text,
              audio_key: upData.key
            })
          });
          
          record.audio_key = upData.key;
          document.getElementById(`record-${currentUser.replaceId}`).remove();
          renderRecord(record);
          
          currentUser.replaceId = null;
          currentUser.replaceKey = null;
        } else {
          currentUser.lastBlob = blob;
          currentUser.lastDuration = duration;
        }
      };

      mediaRecorder.start();
      isRecording = true;
      document.getElementById('micBtn').classList.add('recording');
      document.getElementById('micStatus').innerText = "录音中 (R 停止)";
    } catch (e) {
      alert("无法访问麦克风");
    }
  }

  function stopRecording() {
    if (mediaRecorder && isRecording) {
      mediaRecorder.stop();
      isRecording = false;
      document.getElementById('micBtn').classList.remove('recording');
      document.getElementById('micStatus').innerText = "录音结束";
    }
  }

  async function reRecordDirect(id, key) {
    if (isRecording) { stopRecording(); return; }
    currentUser.replaceId = id;
    currentUser.replaceKey = key;
    startRecording();
  }

  function playAllRecords() {
    if (historyRecords.length === 0) return;
    isContinuousPlaying = true;
    document.getElementById('playAllBtn').style.display = 'none';
    document.getElementById('pauseAllBtn').style.display = 'block';
    const firstWithAudio = historyRecords.find(r => r.audio_key);
    if (firstWithAudio) playAudio(firstWithAudio.audio_key, firstWithAudio.id);
  }

  function pauseAllRecords() {
    isContinuousPlaying = false;
    if (currentAudio) currentAudio.pause();
    document.getElementById('playAllBtn').style.display = 'block';
    document.getElementById('pauseAllBtn').style.display = 'none';
  }

  function playAudio(key, id) {
    if (!key) return alert("该片段没有录音");
    if (currentAudio) currentAudio.pause();
    const url = `${API_BASE}/audio?key=${encodeURIComponent(key)}`;
    currentAudio = new Audio(url);
    currentAudio.onended = () => {
      if (isContinuousPlaying) playNext(id);
      else {
        document.getElementById('playAllBtn').style.display = 'block';
        document.getElementById('pauseAllBtn').style.display = 'none';
      }
    };
    currentAudio.play().catch(e => alert("播放失败"));
  }

  // --- 提交记录 ---
  async function submitEntry() {
    if (!currentUser || !videoId) return alert("请先登录并加载视频");
    const text = document.getElementById('manualInput').value.trim();
    if (!text) return;

    const timestamp = player ? Math.floor(player.getCurrentTime()) : 0;
    const duration = currentUser.lastDuration || 0;
    const orderIndex = historyRecords.length + 1;

    try {
      let audio_key = null;
      // 如果是替换录音模式
      const isReplace = currentUser.replaceId != null;

      if (currentUser.lastBlob) {
        const formData = new FormData();
        formData.append('file', currentUser.lastBlob, `rec-${Date.now()}.mp3`);
        if (isReplace) formData.append('existingKey', currentUser.replaceKey);
        
        const upRes = await fetch(`${API_BASE}/save`, { method: 'POST', body: formData });
        const upData = await upRes.json();
        audio_key = upData.key;
      }

      const payload = isReplace ? {
        id: currentUser.replaceId,
        text,
        audio_key: audio_key || currentUser.replaceKey
      } : {
        user_id: currentUser.id,
        video_id: videoId,
        video_title: videoTitle,
        timestamp,
        duration,
        order_index: orderIndex,
        text,
        audio_key
      };

      const res = await fetch(`${API_BASE}/save`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        const resData = await res.json();
        if (isReplace) {
          const idx = historyRecords.findIndex(r => r.id === currentUser.replaceId);
          historyRecords[idx].text = text;
          if (audio_key) historyRecords[idx].audio_key = audio_key;
          document.getElementById(`record-${currentUser.replaceId}`).remove();
          renderRecord(historyRecords[idx]);
          currentUser.replaceId = null;
          currentUser.replaceKey = null;
        } else {
          const newRecord = { ...payload, id: resData.id, created_at: resData.created_at };
          historyRecords.push(newRecord);
          renderRecord(newRecord);
        }
        document.getElementById('manualInput').value = "";
        currentUser.lastBlob = null;
        currentUser.lastDuration = 0;
        document.getElementById('micStatus').innerText = "点击录音 (R)";
      }
    } catch (e) {
      alert("提交失败: " + e.message);
    }
  }

  // --- 加载历史 ---
  async function loadHistory() {
    const container = document.getElementById('resultsDisplay');
    container.innerHTML = '<div style="text-align:center; padding: 40px; color: #888;">正在同步云端记录...</div>';
    try {
      const res = await fetch(`${API_BASE}/history?user_id=${currentUser.id}`);
      historyRecords = await res.json();
      container.innerHTML = "";
      historyRecords.forEach(renderRecord);
    } catch (e) {
      container.innerHTML = '<div style="color: #ff6b7a; text-align:center;">同步记录失败</div>';
    }
  }

  function formatTime(s) {
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return `${h > 0 ? h + ':' : ''}${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
  }

  function renderRecord(record) {
    if (!record) return;
    const container = document.getElementById('resultsDisplay');
    const div = document.createElement('div');
    div.className = 'record-item';
    div.id = `record-${record.id}`;
    
    const timeStr = formatTime(record.timestamp || 0);
    const durationStr = record.duration ? ` + ${record.duration}s` : "";

    div.innerHTML = `
      <div class="record-actions-col">
        <button class="action-btn" onclick="playAudio('${record.audio_key || ""}', ${record.id})" title="播放录音">${record.audio_key ? '🔊' : '❌'}</button>
        <button class="action-btn" onclick="reRecordDirect(${record.id}, '${record.audio_key || ""}')" title="重录并替换">🎤</button>
        <button class="action-btn" onclick="focusText(${record.id})" title="编辑文字">📝</button>
      </div>
      <div class="record-info">
        <div class="record-meta">
          <span class="record-index">#${record.order_index}</span>
          <span class="record-time" onclick="seekVideo(${record.timestamp || 0})">⏱️ ${timeStr}${durationStr}</span>
          <button class="action-btn" style="font-size:0.9rem" onclick="copyText(\`${(record.text || "").replace(/`/g, '\\`')}\`)" title="复制文字">📋</button>
        </div>
        <textarea id="text-${record.id}" class="manual-text" onchange="updateText(${record.id}, this.value)" placeholder="点击编辑内容...">${record.text || ""}</textarea>
      </div>
    `;
    container.appendChild(div);
  }

  function focusText(id) {
    const el = document.getElementById(`text-${id}`);
    if (el) el.focus();
  }

  async function updateText(id, text) {
    try {
      await fetch(`${API_BASE}/save`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, text })
      });
      const idx = historyRecords.findIndex(r => r.id === id);
      if (idx !== -1) historyRecords[idx].text = text;
    } catch (e) { console.error("自动保存失败"); }
  }

  function seekVideo(t) {
    if (player && player.seekTo) {
      player.seekTo(t);
      player.playVideo();
    }
  }

  function playNext(currentId) {
    const idx = historyRecords.findIndex(r => r.id === currentId);
    if (idx !== -1 && idx < historyRecords.length - 1) {
      const next = historyRecords[idx + 1];
      if (next.audio_key) playAudio(next.audio_key, next.id);
      else playNext(next.id);
    }
  }

  function toggleContinuous(val) { isContinuousPlaying = val; }

  function copyText(text) {
    navigator.clipboard.writeText(text).then(() => {
      const btn = event.currentTarget;
      const old = btn.innerText;
      btn.innerText = "✅";
      setTimeout(() => btn.innerText = old, 1000);
    });
  }

  // --- 管理员逻辑 ---
  async function openAdmin() {
    document.getElementById('adminPanel').style.display = 'block';
    loadUsers();
  }

  function closeAdmin() { document.getElementById('adminPanel').style.display = 'none'; }

  async function loadUsers() {
    const res = await fetch(`${API_BASE}/user?adminId=${currentUser.id}`);
    const users = await res.json();
    const tbody = document.querySelector('#userTable tbody');
    tbody.innerHTML = users.map(u => `
      <tr>
        <td>${u.id}</td>
        <td>${u.username}</td>
        <td>${u.password}</td>
        <td>${u.is_admin ? '管理员' : '普通用户'}</td>
        <td>
          <button onclick="editUser(${u.id}, '${u.username}', '${u.password}', ${u.is_admin})" style="padding: 4px 8px; cursor: pointer;">编辑</button>
          <button onclick="deleteUser(${u.id})" style="padding: 4px 8px; cursor: pointer; color: #e94560;">删除</button>
        </td>
      </tr>
    `).join('');
  }

  function editUser(id, user, pass, admin) {
    document.getElementById('editUserId').value = id;
    document.getElementById('editUsername').value = user;
    document.getElementById('editPassword').value = pass;
    document.getElementById('editIsAdmin').value = admin;
  }

  async function saveUser() {
    const id = document.getElementById('editUserId').value;
    const username = document.getElementById('editUsername').value;
    const password = document.getElementById('editPassword').value;
    const is_admin = parseInt(document.getElementById('editIsAdmin').value);

    await fetch(`${API_BASE}/user`, {
      method: 'POST',
      body: JSON.stringify({
        action: 'manage',
        newUser: { adminId: currentUser.id, targetUser: { id, username, password, is_admin } }
      })
    });
    loadUsers();
    // 清空表单
    document.getElementById('editUserId').value = "";
    document.getElementById('editUsername').value = "";
    document.getElementById('editPassword').value = "";
  }

  async function deleteUser(id) {
    if (!confirm("确定要永久删除该用户吗？")) return;
    await fetch(`${API_BASE}/user`, {
      method: 'POST',
      body: JSON.stringify({ action: 'manage', newUser: { adminId: currentUser.id, targetUser: { id, delete: true } } })
    });
    loadUsers();
  }

  // --- 键盘快捷键 ---
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') {
      if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'manualInput') {
        e.preventDefault();
        submitEntry();
      }
      return;
    }
    if (e.code === 'Space') {
      e.preventDefault();
      if (player && player.getPlayerState) {
        const state = player.getPlayerState();
        state === 1 ? player.pauseVideo() : player.playVideo();
      }
    }
    if (e.code === 'KeyR') {
      e.preventDefault();
      toggleRecording();
    }
  });
</script>

</body>
</html>
