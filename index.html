<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>听写达人 - 全栈版</title>
  <style>
    :root { --primary: #e94560; --bg: #1a1a2e; --card: #16213e; --text: #eee; --accent: #0f3460; --success: #4ecca3; --danger: #ff4d4d; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 120px; transition: filter 0.3s; height: 100vh; overflow: hidden; }
    
    /* 基础按钮美化 */
    .btn-main, .btn-secondary { 
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      border: none;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .btn-main:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(233, 69, 96, 0.3); opacity: 0.9; }
    .btn-secondary:hover { transform: translateY(-1px); background: #555; }
    .btn-main:active, .btn-secondary:active { transform: translateY(0); }

    /* 登录样式 */
    #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
    .login-box { background: var(--card); padding: 40px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); }
    .login-box h2 { margin-bottom: 30px; color: var(--primary); font-size: 2rem; font-weight: 800; letter-spacing: 1px; }
    .login-box input { width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 12px; border: 1px solid #333; background: #0f3460; color: white; font-size: 1rem; transition: border-color 0.3s; }
    .login-box input:focus { border-color: var(--primary); outline: none; background: #16213e; }
    
    /* 记录项高亮 */
    .record-item.active { border-left-color: var(--success); background: rgba(78, 204, 163, 0.05); box-shadow: inset 0 0 10px rgba(78, 204, 163, 0.1); }
    
    /* 片段操作按钮组 */
    .fragment-ops { display: flex; gap: 8px; margin-top: 5px; }
    .op-btn { 
      padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; cursor: pointer; 
      display: flex; align-items: center; gap: 4px; border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05); color: #aaa; transition: all 0.2s;
    }
    .op-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .op-btn.btn-insert:hover { border-color: var(--success); color: var(--success); }
    .op-btn.btn-delete:hover { border-color: var(--danger); color: var(--danger); }
    
    /* 顶部栏 */
    .top-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 10px 20px; border-bottom: 1px solid #333; height: 60px; }
    .user-info { font-size: 0.95rem; color: #aaa; display: flex; align-items: center; gap: 10px; }
    .admin-tag { background: #ffd700; color: #000; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }

    /* 主布局 */
    .main-layout { display: flex; flex-direction: column; height: calc(100vh - 60px); }
    .content-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; padding: 20px; flex: 1; overflow: hidden; }
    
    /* 左侧视频区 */
    .video-pane { display: flex; flex-direction: column; gap: 15px; overflow: hidden; }
    .link-section { display: flex; gap: 10px; }
    .link-section input { flex: 1; padding: 10px 15px; border-radius: 8px; border: 1px solid #333; background: var(--card); color: white; }
    .video-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* 右侧记录区 */
    .record-pane { display: flex; flex-direction: column; background: var(--card); border-radius: 12px; border: 1px solid #333; overflow: hidden; }
    .results-header { padding: 12px 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); }
    .results-display { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }

    /* 记录项样式 */
    .record-item { background: rgba(255,255,255,0.03); padding: 8px 12px; border-radius: 6px; border-left: 3px solid var(--primary); display: flex; gap: 10px; align-items: flex-start; }
    .record-actions-col { display: flex; flex-direction: column; gap: 6px; align-items: center; min-width: 25px; }
    .record-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .record-meta { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: #888; }
    .record-index { background: var(--primary); color: white; padding: 1px 5px; border-radius: 3px; font-weight: bold; }
    .record-time { cursor: pointer; color: var(--primary); font-weight: bold; }
    .manual-text { width: 100%; background: transparent; border: none; color: #ccc; font-size: 0.9rem; line-height: 1.4; resize: none; padding: 0; border-bottom: 1px solid transparent; }
    .manual-text:focus { color: #fff; border-bottom-color: var(--primary); outline: none; }
    .action-btn { cursor: pointer; font-size: 0.9rem; background: none; border: none; color: #aaa; transition: 0.2s; }
    .action-btn:hover { color: var(--primary); transform: scale(1.1); }

    /* 底部控制栏 */
    .controls-footer { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card); padding: 15px 20px; border-top: 1px solid #333; z-index: 100; }
    .input-area { max-width: 1200px; margin: 0 auto; display: flex; gap: 15px; align-items: center; }
    .mic-btn { width: 60px; height: 60px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; }
    .mic-btn.recording { background: var(--primary); animation: pulse 1.5s infinite; }
    .mic-icon { font-size: 24px; color: white; }
    .text-box { flex: 1; position: relative; }
    #manualInput { width: 100%; height: 60px; background: #1a1a2e; color: white; border: 1px solid #444; border-radius: 8px; padding: 10px; resize: none; font-size: 1rem; }
    
    /* 任务面板 */
    #taskPanel { position: fixed; top: 60px; left: 0; width: 100%; height: calc(100vh - 60px); background: var(--bg); z-index: 500; padding: 20px; overflow-y: auto; display: none; }
    .panel-container { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 30px; }
    .panel-section { background: var(--card); border-radius: 12px; border: 1px solid #333; padding: 20px; }
    .panel-section h2 { margin-bottom: 15px; font-size: 1.2rem; color: var(--primary); border-bottom: 1px solid #333; padding-bottom: 10px; }
    
    /* 表格样式 */
    .task-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .task-table th, .task-table td { padding: 12px; text-align: left; border-bottom: 1px solid #333; font-size: 0.9rem; }
    .task-table th { color: #888; font-weight: normal; }
    .task-table tr:hover { background: rgba(255,255,255,0.02); }
    .completion-bar { width: 100px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; position: relative; }
    .completion-fill { height: 100%; background: var(--primary); }
    
    /* 计划列表 */
    .planned-list { display: flex; flex-direction: column; gap: 10px; }
    .planned-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px; }
    .planned-info h3 { font-size: 0.95rem; margin-bottom: 4px; }
    .planned-info span { font-size: 0.8rem; color: #888; }

    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(233, 69, 96, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(233, 69, 96, 0); } 100% { box-shadow: 0 0 0 0 rgba(233, 69, 96, 0); } }

    @media (max-width: 1024px) {
      .content-grid { grid-template-columns: 1fr; overflow-y: auto; height: auto; }
      body { overflow-y: auto; height: auto; }
      .main-layout { height: auto; }
      .record-pane { height: 500px; }
    }
  </style>
</head>
<body class="not-logged-in">

<div id="loginOverlay">
  <div class="login-box">
    <h2>🔐 听写达人</h2>
    <input type="text" id="loginUser" placeholder="用户名/邮箱">
    <input type="password" id="loginPass" placeholder="密码">
    <button class="btn-main" style="width: 100%" onclick="handleLogin()">登录系统</button>
    <p id="loginMsg" style="color: #ff6b7a; margin-top: 15px; font-size: 0.9rem;"></p>
  </div>
</div>

<div id="taskPanel">
  <div class="panel-container">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h1>🎯 学习控制台</h1>
      <button class="btn-main" onclick="closeTasks()">返回听写</button>
    </div>

    <!-- 计划听写 -->
    <div class="panel-section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2>📝 计划听写</h2>
        <div style="display: flex; gap: 10px;">
          <input type="text" id="planUrl" placeholder="输入 YouTube 链接..." style="padding: 8px; border-radius: 6px; background: #1a1a2e; border: 1px solid #444; color: white; width: 300px;">
          <button class="btn-secondary" onclick="addPlan()">+ 加入计划</button>
        </div>
      </div>
      <div id="plannedList" class="planned-list"></div>
    </div>

    <!-- 我的听写任务 -->
    <div class="panel-section">
      <h2>📊 我的听写任务</h2>
      <table class="task-table" id="taskTable">
        <thead>
          <tr>
            <th>最近活动</th>
            <th>视频标题</th>
            <th>片段数</th>
            <th>完成度</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<div class="top-bar">
  <div class="user-info" id="userInfo">未登录</div>
  <div style="display: flex; gap: 15px; align-items: center;">
    <button class="btn-secondary" onclick="openTasks()" style="background: var(--accent);">📂 任务列表</button>
    <div id="adminLink" style="display: none;">
      <button class="btn-secondary" onclick="openAdmin()" style="background: #444;">⚙️ 管理后台</button>
    </div>
    <button onclick="handleLogout()" style="background:none; border:none; color:#888; cursor:pointer">退出</button>
  </div>
</div>

<div class="main-layout">
  <div class="content-grid">
    <div class="video-pane">
      <div id="currentTaskTitle" style="font-weight: bold; font-size: 1.1rem; color: var(--primary); min-height: 1.5rem; margin-bottom: 5px;"></div>
      <div class="video-wrapper"><div id="player"></div></div>
    </div>

    <div class="record-pane">
      <div class="results-header">
        <div style="font-weight: bold; color: var(--primary);">📜 听写片段 (<span id="recordCount">0</span>)</div>
        <div style="display: flex; gap: 10px;">
          <button id="playAllBtn" class="btn-secondary" onclick="playAllRecords()" style="font-size: 0.75rem;">▶️ 全部播放</button>
          <button id="pauseAllBtn" class="btn-secondary" onclick="pauseAllRecords()" style="font-size: 0.75rem; display: none;">⏸️ 停止</button>
          <label style="font-size: 0.75rem; color: #888; cursor: pointer; display: flex; align-items: center; gap: 4px;">
            <input type="checkbox" id="continuousPlayToggle"> 连播
          </label>
        </div>
      </div>
      <div id="resultsDisplay" class="results-display"></div>
    </div>
  </div>
</div>

<div class="controls-footer">
  <div class="input-area">
    <div style="text-align: center;">
      <button id="micBtn" class="mic-btn" onclick="toggleRecording()">
        <span class="mic-icon">🎤</span>
      </button>
      <div id="micStatus" style="font-size: 10px; color: #888; margin-top: 5px;">R 键录音</div>
    </div>
    <div class="text-box">
      <textarea id="manualInput" placeholder="在此输入文字，回车提交记录..."></textarea>
    </div>
    <button class="btn-main" onclick="submitEntry()" style="height: 60px;">提交</button>
  </div>
</div>

<script>
  const API_BASE = '/api';
  let player, mediaRecorder, recordingStartTime;
  let audioChunks = [];
  let isRecording = false;
  let currentUser = null;
  let videoId = null;
  let videoTitle = "";
  let videoTotalDuration = 0;
  let historyRecords = [];
  let currentAudio = null;

  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  function loadVideo(vid, title) {
    videoId = vid;
    if (player) player.destroy();
    player = new YT.Player('player', {
      videoId: vid,
      events: {
        'onReady': (event) => {
          videoTitle = title || event.target.getVideoData().title;
          videoTotalDuration = event.target.getDuration();
          document.getElementById('currentTaskTitle').innerText = videoTitle;
          loadHistory();
          saveVideoMeta(vid, Math.floor(videoTotalDuration));
          
          // 启动播放器状态监听，用于片段自动滚动
          startTrackingPlayer();
        }
      }
    });
  }

  // --- 自动滚动逻辑 ---
  let trackingInterval = null;
  function startTrackingPlayer() {
    if (trackingInterval) clearInterval(trackingInterval);
    trackingInterval = setInterval(() => {
      if (player && player.getPlayerState && player.getPlayerState() === 1) { // 正在播放
        const currentTime = Math.floor(player.getCurrentTime());
        syncFragmentHighlight(currentTime);
      }
    }, 1000);
  }

  function syncFragmentHighlight(currentTime) {
    let activeId = null;
    // 寻找当前时间对应的片段（最接近当前时间且不超过当前时间的片段）
    for (let i = 0; i < historyRecords.length; i++) {
      if (historyRecords[i].timestamp <= currentTime) {
        activeId = historyRecords[i].id;
      } else {
        break;
      }
    }

    if (activeId) {
      document.querySelectorAll('.record-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`record-${activeId}`);
      if (activeEl) {
        activeEl.classList.add('active');
        // 平滑滚动到视野中心
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }
  }

  async function saveVideoMeta(vid, duration) {
    await fetch(`${API_BASE}/save`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ video_id: vid, total_duration: duration })
    });
  }

  // --- 权限管理 ---
  async function handleLogin() {
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value.trim();
    const msg = document.getElementById('loginMsg');
    if (!username || !password) return;

    try {
      const res = await fetch(`${API_BASE}/user`, {
        method: 'POST',
        body: JSON.stringify({ action: 'login', username, password })
      });
      const data = await res.json();
      if (res.ok) {
        currentUser = data;
        document.body.classList.remove('not-logged-in');
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('userInfo').innerHTML = `👤 ${data.username} ${data.is_admin ? '<span class="admin-tag">管理员</span>' : ''}`;
        if (data.is_admin) {
          document.getElementById('adminLink').style.display = 'block';
        }
        openTasks();
      } else { msg.innerText = data.error; }
    } catch (e) { msg.innerText = "网络错误"; }
  }

  function handleLogout() {
    currentUser = null;
    document.body.classList.add('not-logged-in');
    document.getElementById('loginOverlay').style.display = 'flex';
    if (player) player.stopVideo();
  }

  // --- 任务管理 ---
  async function openTasks() {
    document.getElementById('taskPanel').style.display = 'block';
    loadMyTasks();
    loadPlannedTasks();
  }

  async function loadMyTasks() {
    const res = await fetch(`${API_BASE}/tasks?user_id=${currentUser.id}`);
    const tasks = await res.json();
    const tbody = document.querySelector('#taskTable tbody');
    tbody.innerHTML = tasks.map(t => {
      const progress = t.total_duration ? Math.min(100, Math.round((t.recorded_duration / t.total_duration) * 100)) : 0;
      return `
        <tr>
          <td>${new Date(t.last_activity).toLocaleDateString()}</td>
          <td title="${t.video_id}"><a href="https://youtu.be/${t.video_id}" target="_blank" style="color:var(--primary);text-decoration:none">🔗 ${t.video_title}</a></td>
          <td>${t.record_count}</td>
          <td>
            <div style="display:flex; align-items:center; gap:10px">
              <div class="completion-bar"><div class="completion-fill" style="width:${progress}%"></div></div>
              <span>${progress}%</span>
            </div>
          </td>
          <td><button class="btn-secondary" onclick="selectTask('${t.video_id}', '${t.video_title.replace(/'/g, "\\'")}')">复习</button></td>
        </tr>
      `;
    }).join('');
  }

  async function loadPlannedTasks() {
    const res = await fetch(`${API_BASE}/planned?user_id=${currentUser.id}`);
    const tasks = await res.json();
    const list = document.getElementById('plannedList');
    list.innerHTML = tasks.map(t => `
      <div class="planned-item">
        <div class="planned-info">
          <h3>${t.video_title || '获取中...'}</h3>
          <span>${t.video_url}</span>
        </div>
        <div style="display:flex; gap:10px">
          <button class="btn-main" style="padding:6px 12px" onclick="startNow(${t.id}, '${t.video_id}', '${t.video_title.replace(/'/g, "\\'")}')">马上听写</button>
          <button class="btn-secondary" style="padding:6px 12px; background:#444" onclick="deletePlan(${t.id})">删除</button>
        </div>
      </div>
    `).join('') || '<div style="color:#888; text-align:center">暂无计划</div>';
  }

  async function addPlan() {
    const url = document.getElementById('planUrl').value;
    const vid = url.match(/(?:v=|be\/|embed\/)([a-zA-Z0-9_-]{11})/)?.[1];
    if (!vid) return alert("链接无效");
    
    // 模拟自动获取标题 (实际中可以由后端完成，这里先用链接)
    const title = "待处理视频 " + vid;
    await fetch(`${API_BASE}/planned`, {
      method: 'POST',
      body: JSON.stringify({ action: 'add', userId: currentUser.id, videoId: vid, videoTitle: title, videoUrl: url })
    });
    document.getElementById('planUrl').value = "";
    loadPlannedTasks();
  }

  async function deletePlan(id) {
    await fetch(`${API_BASE}/planned`, { method: 'POST', body: JSON.stringify({ action: 'delete', userId: currentUser.id, id }) });
    loadPlannedTasks();
  }

  async function startNow(planId, vid, title) {
    await deletePlan(planId);
    closeTasks();
    loadVideo(vid, title);
  }

  function closeTasks() { document.getElementById('taskPanel').style.display = 'none'; }
  function selectTask(vid, title) { closeTasks(); loadVideo(vid, title); }

  // --- 录音逻辑 ---
  async function toggleRecording() {
    if (!currentUser || !videoId) return;
    isRecording ? stopRecording() : startRecording();
  }

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      recordingStartTime = Date.now();
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = async () => {
        const blob = new Blob(audioChunks, { type: 'audio/mpeg' });
        const duration = Math.round((Date.now() - recordingStartTime) / 1000);
        
        if (currentUser.replaceId) {
          const formData = new FormData();
          formData.append('file', blob, `rec-${Date.now()}.mp3`);
          if (currentUser.replaceKey) formData.append('existingKey', currentUser.replaceKey);
          const upRes = await fetch(`${API_BASE}/save`, { method: 'POST', body: formData });
          const upData = await upRes.json();
          const record = historyRecords.find(r => r.id === currentUser.replaceId);
          await fetch(`${API_BASE}/save`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: currentUser.replaceId, text: record.text, audio_key: upData.key })
          });
          record.audio_key = upData.key;
          document.getElementById(`record-${currentUser.replaceId}`).remove();
          renderRecord(record);
          currentUser.replaceId = null;
        } else {
          currentUser.lastBlob = blob;
          currentUser.lastDuration = duration;
        }
      };
      mediaRecorder.start();
      isRecording = true;
      document.getElementById('micBtn').classList.add('recording');
    } catch (e) { alert("麦克风不可用"); }
  }

  function stopRecording() {
    if (mediaRecorder && isRecording) {
      mediaRecorder.stop();
      isRecording = false;
      document.getElementById('micBtn').classList.remove('recording');
    }
  }

  // --- 记录操作 ---
  async function submitEntry() {
    if (!currentUser || !videoId) return;
    const text = document.getElementById('manualInput').value.trim();
    if (!text) return;
    const timestamp = player ? Math.floor(player.getCurrentTime()) : 0;
    const duration = currentUser.lastDuration || 0;
    const orderIndex = historyRecords.length + 1;
    saveRecord(timestamp, duration, orderIndex, text);
  }

  async function saveRecord(timestamp, duration, orderIndex, text, audioBlob = currentUser.lastBlob) {
    try {
      let audio_key = null;
      if (audioBlob) {
        const formData = new FormData();
        formData.append('file', audioBlob, `rec-${Date.now()}.mp3`);
        const upRes = await fetch(`${API_BASE}/save`, { method: 'POST', body: formData });
        const upData = await upRes.json();
        audio_key = upData.key;
      }
      const payload = { user_id: currentUser.id, video_id: videoId, video_title: videoTitle, timestamp, duration, order_index: orderIndex, text, audio_key };
      const res = await fetch(`${API_BASE}/save`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      if (res.ok) {
        const resData = await res.json();
        const newRec = { ...payload, id: resData.id };
        historyRecords.splice(orderIndex - 1, 0, newRec);
        refreshDisplay();
        document.getElementById('manualInput').value = "";
        currentUser.lastBlob = null;
      }
    } catch (e) { alert("保存失败"); }
  }

  async function deleteRecord(id, orderIndex) {
    if (!confirm("确定删除片段吗？")) return;
    await fetch(`${API_BASE}/save`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'delete', id, video_id: videoId, user_id: currentUser.id, order_index: orderIndex })
    });
    historyRecords = historyRecords.filter(r => r.id !== id).map((r, i) => ({ ...r, order_index: i + 1 }));
    refreshDisplay();
  }

  async function insertRecord(afterOrderIndex) {
    const timestamp = player ? Math.floor(player.getCurrentTime()) : 0;
    const res = await fetch(`${API_BASE}/save`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'insert', user_id: currentUser.id, video_id: videoId, video_title: videoTitle, timestamp, order_index: afterOrderIndex + 1, text: "新片段" })
    });
    if (res.ok) {
      const data = await res.json();
      loadHistory(); // 重新加载以确保索引同步
    }
  }

  async function loadHistory() {
    try {
      const res = await fetch(`${API_BASE}/history?user_id=${currentUser.id}&video_id=${videoId}`);
      historyRecords = await res.json();
      refreshDisplay();
    } catch (e) { }
  }

  function refreshDisplay() {
    const container = document.getElementById('resultsDisplay');
    container.innerHTML = "";
    historyRecords.forEach(renderRecord);
    document.getElementById('recordCount').innerText = historyRecords.length;
  }

  function renderRecord(record) {
    const container = document.getElementById('resultsDisplay');
    const div = document.createElement('div');
    div.className = 'record-item';
    div.id = `record-${record.id}`;
    div.innerHTML = `
      <div class="record-actions-col">
        <button class="action-btn" onclick="playAudio('${record.audio_key || ""}', ${record.id})">${record.audio_key ? '🔊' : '❌'}</button>
        <button class="action-btn" onclick="reRecordDirect(${record.id}, '${record.audio_key || ""}')">🎤</button>
        <button class="action-btn" onclick="document.getElementById('text-${record.id}').focus()">📝</button>
      </div>
      <div class="record-info">
        <div class="record-meta">
          <span class="record-index">#${record.order_index}</span>
          <span class="record-time" onclick="seekVideo(${record.timestamp})">⏱️ ${Math.floor(record.timestamp/60)}:${(record.timestamp%60).toString().padStart(2,'0')}${record.duration ? ' + ' + record.duration + 's' : ''}</span>
          <button class="action-btn" onclick="copyText(this, \`${record.text}\`)">📋</button>
        </div>
        <textarea id="text-${record.id}" class="manual-text" onchange="updateText(${record.id}, this.value)" placeholder="在这里输入听写内容...">${record.text}</textarea>
        <div class="fragment-ops">
          <button class="op-btn btn-insert" onclick="insertRecord(${record.order_index})">➕ 插入片段</button>
          <button class="op-btn btn-delete" onclick="deleteRecord(${record.id}, ${record.order_index})">🗑️ 删除</button>
        </div>
      </div>
    `;
    container.appendChild(div);
  }

  async function updateText(id, text) {
    await fetch(`${API_BASE}/save`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, text }) });
  }

  function seekVideo(t) { if (player) player.seekTo(t); }
  function playAudio(key, id) {
    if (!key) return;
    if (currentAudio) currentAudio.pause();
    const url = `${API_BASE}/audio?key=${encodeURIComponent(key)}`;
    currentAudio = new Audio(url);
    currentAudio.onended = () => { if (document.getElementById('continuousPlayToggle').checked) playNext(id); };
    currentAudio.play();
  }
  function playNext(currentId) {
    const idx = historyRecords.findIndex(r => r.id === currentId);
    if (idx !== -1 && idx < historyRecords.length - 1) {
      const next = historyRecords[idx + 1];
      if (next.audio_key) playAudio(next.audio_key, next.id);
      else playNext(next.id);
    }
  }
  function playAllRecords() {
    document.getElementById('playAllBtn').style.display = 'none';
    document.getElementById('pauseAllBtn').style.display = 'block';
    const first = historyRecords.find(r => r.audio_key);
    if (first) playAudio(first.audio_key, first.id);
  }
  function pauseAllRecords() {
    if (currentAudio) currentAudio.pause();
    document.getElementById('playAllBtn').style.display = 'block';
    document.getElementById('pauseAllBtn').style.display = 'none';
  }
  function copyText(btn, text) {
    navigator.clipboard.writeText(text).then(() => {
      const old = btn.innerText;
      btn.innerText = "✅";
      setTimeout(() => btn.innerText = old, 1000);
    });
  }
  function reRecordDirect(id, key) {
    if (isRecording) { stopRecording(); return; }
    currentUser.replaceId = id;
    currentUser.replaceKey = key;
    startRecording();
  }
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') {
      if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'manualInput') { e.preventDefault(); submitEntry(); }
      return;
    }
    if (e.code === 'Space') { e.preventDefault(); if (player) { const s = player.getPlayerState(); s === 1 ? player.pauseVideo() : player.playVideo(); } }
    if (e.code === 'KeyR') { e.preventDefault(); toggleRecording(); }
  });
</script>
</body>
</html>
