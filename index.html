<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>听写助手 Pro - 全栈版</title>
  <style>
    :root { --primary: #e94560; --bg: #1a1a2e; --card: #16213e; --text: #eee; --accent: #0f3460; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: var(--bg); color: var(--text); padding-bottom: 120px; transition: filter 0.3s; height: 100vh; overflow: hidden; }
    
    /* 页面禁用状态 */
    body.not-logged-in { overflow: hidden; }
    body.not-logged-in .main-layout { filter: grayscale(1) blur(5px); pointer-events: none; opacity: 0.5; }

    /* 登录样式 */
    #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
    .login-box { background: var(--card); padding: 40px; border-radius: 16px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid #333; }
    .login-box h2 { margin-bottom: 25px; color: var(--primary); font-size: 1.8rem; }
    .login-box input { width: 100%; padding: 14px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #333; background: #1a1a2e; color: white; font-size: 1rem; }
    
    /* 顶部栏 */
    .top-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 10px 20px; border-bottom: 1px solid #333; height: 60px; }
    .user-info { font-size: 0.95rem; color: #aaa; display: flex; align-items: center; gap: 10px; }
    .admin-tag { background: #ffd700; color: #000; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }

    /* 主布局 */
    .main-layout { display: flex; flex-direction: column; height: calc(100vh - 60px); }
    .content-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; padding: 20px; flex: 1; overflow: hidden; }
    
    /* 左侧视频区 */
    .video-pane { display: flex; flex-direction: column; gap: 15px; overflow: hidden; }
    .link-section { display: flex; gap: 10px; }
    .link-section input { flex: 1; padding: 10px 15px; border-radius: 8px; border: 1px solid #333; background: var(--card); color: white; }
    .video-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* 右侧记录区 */
    .record-pane { display: flex; flex-direction: column; background: var(--card); border-radius: 12px; border: 1px solid #333; overflow: hidden; }
    .results-header { padding: 12px 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); }
    .results-display { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }

    /* 记录项样式 (紧凑) */
    .record-item { background: rgba(255,255,255,0.03); padding: 8px 12px; border-radius: 6px; border-left: 3px solid var(--primary); display: flex; gap: 10px; align-items: flex-start; }
    .record-actions-col { display: flex; flex-direction: column; gap: 8px; align-items: center; min-width: 25px; }
    .record-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .record-meta { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: #888; }
    .record-index { background: var(--primary); color: white; padding: 1px 5px; border-radius: 3px; font-weight: bold; }
    .record-time { cursor: pointer; color: var(--primary); font-weight: bold; }
    .manual-text { width: 100%; background: transparent; border: none; color: #ccc; font-size: 0.9rem; line-height: 1.4; resize: none; padding: 0; border-bottom: 1px solid transparent; }
    .manual-text:focus { color: #fff; border-bottom-color: var(--primary); outline: none; }
    .action-btn { cursor: pointer; font-size: 1rem; background: none; border: none; color: #aaa; transition: 0.2s; }
    .action-btn:hover { color: var(--primary); transform: scale(1.1); }

    /* 底部控制栏 */
    .controls-footer { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card); padding: 15px 20px; border-top: 1px solid #333; z-index: 100; }
    .input-area { max-width: 1200px; margin: 0 auto; display: flex; gap: 15px; align-items: center; }
    .mic-btn { width: 60px; height: 60px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; }
    .mic-btn.recording { background: var(--primary); animation: pulse 1.5s infinite; }
    .mic-icon { font-size: 24px; color: white; }
    .text-box { flex: 1; position: relative; }
    #manualInput { width: 100%; height: 60px; background: #1a1a2e; color: white; border: 1px solid #444; border-radius: 8px; padding: 10px; resize: none; font-size: 1rem; }
    
    /* 任务面板 (Dashboard) */
    #taskPanel { position: fixed; top: 60px; left: 0; width: 100%; height: calc(100vh - 60px); background: var(--bg); z-index: 500; padding: 30px; overflow-y: auto; display: none; }
    .task-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
    .task-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #333; cursor: pointer; transition: 0.3s; position: relative; }
    .task-card:hover { border-color: var(--primary); transform: translateY(-5px); }
    .task-card h3 { font-size: 1rem; margin-bottom: 10px; color: #fff; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .task-meta { font-size: 0.8rem; color: #888; display: flex; justify-content: space-between; }

    /* 管理后台 */
    #adminPanel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 1500; padding: 30px; overflow-y: auto; display: none; }

    .btn-main { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .btn-secondary { background: #444; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }

    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(233, 69, 96, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(233, 69, 96, 0); } 100% { box-shadow: 0 0 0 0 rgba(233, 69, 96, 0); } }

    @media (max-width: 1024px) {
      .content-grid { grid-template-columns: 1fr; overflow-y: auto; height: auto; }
      body { overflow-y: auto; height: auto; }
      .main-layout { height: auto; }
      .record-pane { height: 500px; }
    }
  </style>
</head>
<body class="not-logged-in">

<!-- 登录遮罩 -->
<div id="loginOverlay">
  <div class="login-box">
    <h2>🔐 听写助手 Pro</h2>
    <input type="text" id="loginUser" placeholder="用户名/邮箱" value="yqcw@qq.com">
    <input type="password" id="loginPass" placeholder="密码" value="123456">
    <button class="btn-main" style="width: 100%" onclick="handleLogin()">登录系统</button>
    <p id="loginMsg" style="color: #ff6b7a; margin-top: 15px; font-size: 0.9rem;"></p>
  </div>
</div>

<!-- 任务面板 (我的任务) -->
<div id="taskPanel">
  <div style="max-width: 1200px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>📚 我的听写任务</h2>
      <button class="btn-main" onclick="closeTasks()">返回当前听写</button>
    </div>
    <div id="taskList" class="task-grid">
      <!-- 任务卡片加载区 -->
    </div>
  </div>
</div>

<!-- 管理后台 (略，保持逻辑) -->
<div id="adminPanel" style="display:none">
  <!-- 管理员逻辑保持不变 -->
  <div class="container" style="max-width:900px; margin:0 auto">
    <button class="btn-secondary" onclick="closeAdmin()">关闭后台</button>
    <div id="adminContent"></div>
  </div>
</div>

<div class="top-bar">
  <div class="user-info" id="userInfo">未登录</div>
  <div style="display: flex; gap: 15px; align-items: center;">
    <button class="btn-secondary" onclick="openTasks()" style="background: var(--accent);">📂 我的任务</button>
    <div id="adminLink" style="display: none;">
      <button class="btn-secondary" onclick="openAdmin()" style="background: #444;">⚙️ 管理后台</button>
    </div>
    <button onclick="handleLogout()" style="background:none; border:none; color:#888; cursor:pointer">退出</button>
  </div>
</div>

<div class="main-layout">
  <div class="content-grid">
    <!-- 左侧视频 -->
    <div class="video-pane">
      <div class="link-section">
        <input type="text" id="videoUrl" placeholder="输入新的 YouTube 链接添加听写任务...">
        <button class="btn-main" onclick="loadVideo()">添加听写任务</button>
      </div>
      <div id="currentTaskTitle" style="font-weight: bold; font-size: 1.1rem; color: var(--primary); min-height: 1.5rem;"></div>
      <div class="video-wrapper"><div id="player"></div></div>
    </div>

    <!-- 右侧记录 -->
    <div class="record-pane">
      <div class="results-header">
        <div style="font-weight: bold; color: var(--primary);">📜 听写片段 (<span id="recordCount">0</span>)</div>
        <div style="display: flex; gap: 10px;">
          <button id="playAllBtn" class="btn-secondary" onclick="playAllRecords()" style="font-size: 0.75rem;">▶️ 全部播放</button>
          <button id="pauseAllBtn" class="btn-secondary" onclick="pauseAllRecords()" style="font-size: 0.75rem; display: none;">⏸️ 停止</button>
          <label style="font-size: 0.75rem; color: #888; cursor: pointer; display: flex; align-items: center; gap: 4px;">
            <input type="checkbox" id="continuousPlayToggle"> 连播
          </label>
        </div>
      </div>
      <div id="resultsDisplay" class="results-display"></div>
    </div>
  </div>
</div>

<div class="controls-footer">
  <div class="input-area">
    <div style="text-align: center;">
      <button id="micBtn" class="mic-btn" onclick="toggleRecording()">
        <span class="mic-icon">🎤</span>
      </button>
      <div id="micStatus" style="font-size: 10px; color: #888; margin-top: 5px;">R 键录音</div>
    </div>
    <div class="text-box">
      <textarea id="manualInput" placeholder="在此输入文字，回车提交记录..."></textarea>
    </div>
    <button class="btn-main" onclick="submitEntry()" style="height: 60px;">提交</button>
  </div>
</div>

<script>
  const API_BASE = '/api';
  let player, mediaRecorder, recordingStartTime;
  let audioChunks = [];
  let isRecording = false;
  let currentUser = null;
  let videoId = null;
  let videoTitle = "";
  let historyRecords = [];
  let currentAudio = null;

  // --- YouTube API ---
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  function loadVideo(vidToLoad = null, titleToLoad = null) {
    const url = document.getElementById('videoUrl').value;
    const vid = vidToLoad || url.match(/(?:v=|be\/|embed\/)([a-zA-Z0-9_-]{11})/)?.[1];
    if (!vid) return alert("请输入有效的 YouTube 链接");
    
    videoId = vid;
    document.getElementById('videoUrl').value = "";
    
    if (player) player.destroy();
    player = new YT.Player('player', {
      videoId: vid,
      events: {
        'onReady': (event) => {
          videoTitle = titleToLoad || event.target.getVideoData().title || "听写任务";
          document.getElementById('currentTaskTitle').innerText = videoTitle;
          loadHistory();
        }
      }
    });
  }

  // --- 权限管理 ---
  async function handleLogin() {
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value.trim();
    const msg = document.getElementById('loginMsg');
    if (!username || !password) return;

    try {
      const res = await fetch(`${API_BASE}/user`, {
        method: 'POST',
        body: JSON.stringify({ action: 'login', username, password })
      });
      const data = await res.json();
      if (res.ok) {
        currentUser = data;
        document.body.classList.remove('not-logged-in');
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('userInfo').innerHTML = `👤 ${data.username} ${data.is_admin ? '<span class="admin-tag">管理员</span>' : ''}`;
        if (data.is_admin) document.getElementById('adminLink').style.display = 'block';
        // 自动打开任务列表
        openTasks();
      } else {
        msg.innerText = data.error;
      }
    } catch (e) { msg.innerText = "网络错误"; }
  }

  function handleLogout() {
    currentUser = null;
    document.body.classList.add('not-logged-in');
    document.getElementById('loginOverlay').style.display = 'flex';
    if (player) player.stopVideo();
  }

  // --- 任务管理 ---
  async function openTasks() {
    if (!currentUser) return;
    document.getElementById('taskPanel').style.display = 'block';
    const list = document.getElementById('taskList');
    list.innerHTML = '<div style="color:#888">正在加载任务列表...</div>';
    
    try {
      const res = await fetch(`${API_BASE}/tasks?user_id=${currentUser.id}`);
      const tasks = await res.json();
      list.innerHTML = tasks.map(t => `
        <div class="task-card" onclick="selectTask('${t.video_id}', '${t.video_title.replace(/'/g, "\\'")}')">
          <h3>${t.video_title}</h3>
          <div class="task-meta">
            <span>📝 ${t.record_count} 个片段</span>
            <span>📅 ${new Date(t.last_activity).toLocaleDateString()}</span>
          </div>
        </div>
      `).join('') || '<div style="color:#888">暂无听写任务，快去添加一个吧！</div>';
    } catch (e) { list.innerHTML = "加载失败"; }
  }

  function closeTasks() {
    document.getElementById('taskPanel').style.display = 'none';
  }

  function selectTask(vid, title) {
    closeTasks();
    loadVideo(vid, title);
  }

  // --- 录音逻辑 ---
  async function toggleRecording() {
    if (!currentUser || !videoId) return;
    isRecording ? stopRecording() : startRecording();
  }

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      recordingStartTime = Date.now();
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = async () => {
        const blob = new Blob(audioChunks, { type: 'audio/mpeg' });
        const duration = Math.round((Date.now() - recordingStartTime) / 1000);
        
        if (currentUser.replaceId) {
          const formData = new FormData();
          formData.append('file', blob, `rec-${Date.now()}.mp3`);
          if (currentUser.replaceKey) formData.append('existingKey', currentUser.replaceKey);
          const upRes = await fetch(`${API_BASE}/save`, { method: 'POST', body: formData });
          const upData = await upRes.json();
          
          const record = historyRecords.find(r => r.id === currentUser.replaceId);
          await fetch(`${API_BASE}/save`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: currentUser.replaceId, text: record.text, audio_key: upData.key })
          });
          record.audio_key = upData.key;
          document.getElementById(`record-${currentUser.replaceId}`).remove();
          renderRecord(record);
          currentUser.replaceId = null;
          currentUser.replaceKey = null;
        } else {
          currentUser.lastBlob = blob;
          currentUser.lastDuration = duration;
        }
      };
      mediaRecorder.start();
      isRecording = true;
      document.getElementById('micBtn').classList.add('recording');
    } catch (e) { alert("麦克风不可用"); }
  }

  function stopRecording() {
    if (mediaRecorder && isRecording) {
      mediaRecorder.stop();
      isRecording = false;
      document.getElementById('micBtn').classList.remove('recording');
    }
  }

  async function reRecordDirect(id, key) {
    if (isRecording) { stopRecording(); return; }
    currentUser.replaceId = id;
    currentUser.replaceKey = key;
    startRecording();
  }

  // --- 提交记录 ---
  async function submitEntry() {
    if (!currentUser || !videoId) return;
    const text = document.getElementById('manualInput').value.trim();
    if (!text) return;

    const timestamp = player ? Math.floor(player.getCurrentTime()) : 0;
    const duration = currentUser.lastDuration || 0;
    const orderIndex = historyRecords.length + 1;

    try {
      let audio_key = null;
      if (currentUser.lastBlob) {
        const formData = new FormData();
        formData.append('file', currentUser.lastBlob, `rec-${Date.now()}.mp3`);
        const upRes = await fetch(`${API_BASE}/save`, { method: 'POST', body: formData });
        const upData = await upRes.json();
        audio_key = upData.key;
      }

      const payload = {
        user_id: currentUser.id,
        video_id: videoId,
        video_title: videoTitle,
        timestamp,
        duration,
        order_index: orderIndex,
        text,
        audio_key
      };

      const res = await fetch(`${API_BASE}/save`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        const resData = await res.json();
        const newRecord = { ...payload, id: resData.id };
        historyRecords.push(newRecord);
        renderRecord(newRecord);
        document.getElementById('manualInput').value = "";
        currentUser.lastBlob = null;
        currentUser.lastDuration = 0;
        updateCount();
      }
    } catch (e) { alert("提交失败"); }
  }

  // --- 加载历史 ---
  async function loadHistory() {
    const container = document.getElementById('resultsDisplay');
    container.innerHTML = '<div style="text-align:center; padding: 20px;">同步记录中...</div>';
    try {
      const res = await fetch(`${API_BASE}/history?user_id=${currentUser.id}&video_id=${videoId}`);
      historyRecords = await res.json();
      container.innerHTML = "";
      historyRecords.forEach(renderRecord);
      updateCount();
    } catch (e) { container.innerHTML = "同步失败"; }
  }

  function updateCount() {
    document.getElementById('recordCount').innerText = historyRecords.length;
  }

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
  }

  function renderRecord(record) {
    const container = document.getElementById('resultsDisplay');
    const div = document.createElement('div');
    div.className = 'record-item';
    div.id = `record-${record.id}`;
    
    div.innerHTML = `
      <div class="record-actions-col">
        <button class="action-btn" onclick="playAudio('${record.audio_key || ""}', ${record.id})">${record.audio_key ? '🔊' : '❌'}</button>
        <button class="action-btn" onclick="reRecordDirect(${record.id}, '${record.audio_key || ""}')">🎤</button>
        <button class="action-btn" onclick="document.getElementById('text-${record.id}').focus()">📝</button>
      </div>
      <div class="record-info">
        <div class="record-meta">
          <span class="record-index">#${record.order_index}</span>
          <span class="record-time" onclick="seekVideo(${record.timestamp})">⏱️ ${formatTime(record.timestamp)}${record.duration ? ' + ' + record.duration + 's' : ''}</span>
          <button class="action-btn" onclick="copyText(this, \`${record.text.replace(/`/g, '\\`')}\`)">📋</button>
        </div>
        <textarea id="text-${record.id}" class="manual-text" onchange="updateText(${record.id}, this.value)">${record.text}</textarea>
      </div>
    `;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  async function updateText(id, text) {
    await fetch(`${API_BASE}/save`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, text })
    });
  }

  function seekVideo(t) {
    if (player && player.seekTo) {
      player.seekTo(t);
      player.playVideo();
    }
  }

  function playAudio(key, id) {
    if (!key) return;
    if (currentAudio) currentAudio.pause();
    const url = `${API_BASE}/audio?key=${encodeURIComponent(key)}`;
    currentAudio = new Audio(url);
    currentAudio.onended = () => {
      if (document.getElementById('continuousPlayToggle').checked) playNext(id);
    };
    currentAudio.play();
  }

  function playNext(currentId) {
    const idx = historyRecords.findIndex(r => r.id === currentId);
    if (idx !== -1 && idx < historyRecords.length - 1) {
      const next = historyRecords[idx + 1];
      if (next.audio_key) playAudio(next.audio_key, next.id);
      else playNext(next.id);
    }
  }

  function playAllRecords() {
    if (historyRecords.length === 0) return;
    document.getElementById('playAllBtn').style.display = 'none';
    document.getElementById('pauseAllBtn').style.display = 'block';
    const first = historyRecords.find(r => r.audio_key);
    if (first) playAudio(first.audio_key, first.id);
  }

  function pauseAllRecords() {
    if (currentAudio) currentAudio.pause();
    document.getElementById('playAllBtn').style.display = 'block';
    document.getElementById('pauseAllBtn').style.display = 'none';
  }

  function copyText(btn, text) {
    navigator.clipboard.writeText(text).then(() => {
      const old = btn.innerText;
      btn.innerText = "✅";
      setTimeout(() => btn.innerText = old, 1000);
    });
  }

  // --- 键盘快捷键 ---
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') {
      if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'manualInput') {
        e.preventDefault();
        submitEntry();
      }
      return;
    }
    if (e.code === 'Space') {
      e.preventDefault();
      if (player && player.getPlayerState) {
        const state = player.getPlayerState();
        state === 1 ? player.pauseVideo() : player.playVideo();
      }
    }
    if (e.code === 'KeyR') {
      e.preventDefault();
      toggleRecording();
    }
  });

  // 管理后台占位
  function openAdmin() { alert("管理后台正在建设中..."); }
</script>

</body>
</html>
