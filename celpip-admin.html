<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员后台 - CELPIP</title>
  <link rel="stylesheet" href="celpip.css">
  <style>
    .admin-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--celpip-border); margin-bottom: 24px; }
    .admin-tab {
      padding: 10px 16px; cursor: pointer; font-weight: 600; color: var(--celpip-muted);
      border-bottom: 2px solid transparent;
    }
    .admin-tab.active { color: var(--celpip-primary); border-bottom-color: var(--celpip-primary); }
    .admin-pane { display: none; }
    .admin-pane.active { display: block; }
    .form-row { margin-bottom: 16px; }
    .paper-row {
      display:flex; align-items:center; gap:12px; padding:14px;
      border:1px solid var(--celpip-border); border-radius:10px; margin-bottom:10px; background:#FFF;
    }
    .paper-row-info { flex:1 }
    .paper-row-actions { display:flex; gap:6px; flex-shrink:0 }
    .prompt-card { padding:16px; border:1px solid var(--celpip-border); border-radius:10px; margin-bottom:12px; background:#FFF; }
    .textarea { width:100%; min-height:120px; padding:10px; border:1px solid var(--celpip-border); border-radius:6px; font-size:13px; font-family:inherit; }
  </style>
</head>
<body>
  <div class="celpip-container">
    <div class="celpip-hero">
      <div style="flex:1"><h1>⚙️ 管理员后台</h1><p>AI 配置 / 提示词模板 / 试卷管理</p></div>
    </div>

    <div id="notAdmin" style="display:none">
      <div class="celpip-alert error">仅管理员可访问。</div>
    </div>

    <div id="adminBody" style="display:none">
      <div class="admin-tabs">
        <div class="admin-tab active" data-tab="papers" onclick="showTab('papers')">📄 试卷管理</div>
        <div class="admin-tab" data-tab="settings" onclick="showTab('settings')">🔧 AI 配置</div>
        <div class="admin-tab" data-tab="prompts" onclick="showTab('prompts')">✏️ 提示词模板</div>
      </div>

      <!-- ================= 试卷管理 ================= -->
      <div id="tab-papers" class="admin-pane active">
        <div class="celpip-card" style="margin-bottom:16px">
          <h3 style="margin-bottom:8px">① 初始化 / 更新数据库</h3>
          <p style="color:var(--celpip-muted);font-size:13px;margin-bottom:12px">第一次部署或 schema 更新后必须点击。会创建 CELPIP 相关表并 seed 默认配置。</p>
          <button class="celpip-btn secondary" id="migrateBtn" onclick="runMigrate()">运行迁移</button>
          <div id="migrateResult" style="margin-top:12px;font-size:12px"></div>
        </div>

        <div class="celpip-card" style="margin-bottom:16px">
          <h3 style="margin-bottom:12px">② 新建试卷</h3>
          <div class="form-row">
            <label class="celpip-label">试卷标题</label>
            <input id="newTitle" class="celpip-input" placeholder="例如：CELPIP 模拟 001">
          </div>
          <div class="form-row">
            <label class="celpip-label">目标 CLB 等级</label>
            <input id="newDifficulty" class="celpip-input" value="CLB9">
          </div>
          <button class="celpip-btn" onclick="createPaper()">新建试卷</button>
        </div>

        <div style="margin-bottom:12px;display:flex;align-items:center;justify-content:space-between">
          <h3>③ 试卷列表</h3>
          <button class="celpip-btn secondary small" onclick="loadPapers()">🔄 刷新</button>
        </div>
        <div id="papersList"><div class="celpip-loading"></div></div>
      </div>

      <!-- ================= AI 配置 ================= -->
      <div id="tab-settings" class="admin-pane">
        <div class="celpip-alert">
          <b>提示：</b>VOLC_API_KEY 等密钥请在 Cloudflare Dashboard → Pages → Settings → Environment variables 添加为 encrypted 变量。
          此处仅存 model 引用名。
        </div>
        <div class="celpip-card">
          <div id="secretStatus" style="margin-bottom:16px"></div>
          <div id="settingsForm"></div>
          <button class="celpip-btn" style="margin-top:16px" onclick="saveSettings()">保存配置</button>
        </div>
      </div>

      <!-- ================= 提示词 ================= -->
      <div id="tab-prompts" class="admin-pane">
        <p style="color:var(--celpip-muted);font-size:13px;margin-bottom:16px">按板块分组，保存自动 v+1，最新版本自动生效。</p>
        <div id="promptsList"><div class="celpip-loading"></div></div>
      </div>
    </div>
  </div>

  <script src="celpip.js"></script>
  <script>
    const user = celpipGetUser();
    if (!user.userId) {
      alert('请先在主页登录');
      location.href = 'index.html';
    } else if (!user.isAdmin) {
      celpipRenderNav('admin');
      document.getElementById('notAdmin').style.display = 'block';
    } else {
      celpipRenderNav('admin');
      document.getElementById('adminBody').style.display = 'block';
      // 默认加载 papers tab
      loadPapers();
    }

    function showTab(name) {
      document.querySelectorAll('.admin-tab').forEach(t =>
        t.classList.toggle('active', t.dataset.tab === name));
      document.querySelectorAll('.admin-pane').forEach(p =>
        p.classList.toggle('active', p.id === 'tab-' + name));
      if (name === 'settings') loadSettings();
      if (name === 'prompts') loadPrompts();
      if (name === 'papers') loadPapers();
    }

    // ================= 迁移 =================
    async function runMigrate() {
      const btn = document.getElementById('migrateBtn');
      btn.disabled = true; btn.textContent = '迁移中…';
      try {
        const data = await celpipApi('/admin/migrate', {
          method: 'POST', body: { user_id: user.userId },
        });
        const errs = (data.results || []).filter(r => r.status === 'error');
        document.getElementById('migrateResult').innerHTML = errs.length
          ? `<div class="celpip-alert error">部分失败：${errs.length} 条<br>${errs.slice(0, 3).map(e => escapeHtml(e.error || '')).join('<br>')}</div>`
          : `<div class="celpip-alert success">✓ 迁移完成，共 ${data.results?.length || 0} 条语句</div>`;
        loadPapers();
      } catch (e) {
        document.getElementById('migrateResult').innerHTML = `<div class="celpip-alert error">${escapeHtml(e.message)}</div>`;
      } finally {
        btn.disabled = false; btn.textContent = '运行迁移';
      }
    }

    // ================= 试卷 =================
    async function loadPapers() {
      const box = document.getElementById('papersList');
      box.innerHTML = '<div class="celpip-loading"></div>';
      try {
        const data = await celpipApi('/admin/papers', { query: { user_id: user.userId } });
        const papers = data.papers || [];
        if (papers.length === 0) {
          box.innerHTML = '<div class="celpip-empty"><h3>还没有试卷</h3><p>在上方新建一份吧。</p></div>';
          return;
        }
        // 并发拉取每份试卷各 section 的题目数（决定默认勾选）
        const withCounts = await Promise.all(papers.map(async p => {
          try {
            const r = await celpipApi('/celpip/papers', { query: { id: p.id } });
            return { ...p, counts: r.counts || {} };
          } catch { return { ...p, counts: {} }; }
        }));

        box.innerHTML = withCounts.map(p => {
          const c = p.counts || {};
          const has = (k) => (c[k] || 0) > 0;
          const chk = (k, label) => {
            const done = has(k);
            const checked = done ? '' : 'checked';
            const badge = done ? `<span style="color:var(--celpip-success);font-weight:700;margin-left:4px">✓ 已生成 ${c[k]}</span>` : '';
            return `<label style="${done ? 'color:var(--celpip-subtle)' : ''}">
              <input type="checkbox" class="gen-sec" data-paper="${p.id}" value="${k}" ${checked}> ${label}${badge}
            </label>`;
          };
          return `
            <div class="paper-row">
              <div class="paper-row-info">
                <div style="font-weight:700">${escapeHtml(p.title)}</div>
                <div style="font-size:12px;color:#8A94A6;margin-top:2px">
                  #${p.id} · ${escapeHtml(p.difficulty || 'CLB9')} · ${p.status === 'published' ? '已发布' : '草稿'} · ${new Date(p.created_at).toLocaleDateString()}
                </div>
                <div style="margin-top:10px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px">
                  <span style="color:#5C6773">生成板块：</span>
                  ${chk('listening', '听力')}
                  ${chk('reading', '阅读')}
                  ${chk('writing', '写作')}
                  ${chk('speaking', '口语')}
                </div>
              </div>
              <div class="paper-row-actions">
                <a class="celpip-btn secondary small" href="celpip-paper-edit.html?id=${p.id}">📝 编辑</a>
                <button class="celpip-btn small" onclick="generateAll(${p.id}, this)">一键生成</button>
                ${p.status !== 'published'
                  ? `<button class="celpip-btn success small" onclick="setStatus(${p.id}, 'published')">发布</button>`
                  : `<button class="celpip-btn secondary small" onclick="setStatus(${p.id}, 'draft')">撤回</button>`}
                <button class="celpip-btn danger small" onclick="deletePaper(${p.id})">删除</button>
              </div>
            </div>`;
        }).join('');
      } catch (e) {
        box.innerHTML = `<div class="celpip-alert error">${escapeHtml(e.message)}</div>`;
      }
    }

    async function createPaper() {
      const title = document.getElementById('newTitle').value.trim();
      const difficulty = document.getElementById('newDifficulty').value.trim() || 'CLB9';
      if (!title) { alert('请填写标题'); return; }
      try {
        await celpipApi('/celpip/papers', {
          method: 'POST',
          body: { user_id: user.userId, action: 'create', title, difficulty, status: 'draft' },
        });
        document.getElementById('newTitle').value = '';
        loadPapers();
      } catch (e) { alert('新建失败：' + e.message); }
    }

    async function generateAll(paperId, btn) {
      // 读取该行勾选的 section
      const sections = Array.from(
        document.querySelectorAll(`input.gen-sec[data-paper="${paperId}"]:checked`)
      ).map(inp => inp.value);
      if (sections.length === 0) { alert('请至少勾选一个板块'); return; }

      // 打开进度对话框
      openProgressModal(paperId, sections);

      // 计算每个 section 的题目数（可以后续做成可配置）
      const plan = [];
      for (const s of sections) {
        if (s === 'listening')      for (let p = 1; p <= 6; p++) plan.push({ section: s, part_or_task: p });
        else if (s === 'reading')   for (let p = 1; p <= 4; p++) plan.push({ section: s, part_or_task: p });
        else if (s === 'writing')   for (let t = 1; t <= 2; t++) plan.push({ section: s, part_or_task: t });
        else if (s === 'speaking')  for (let t = 1; t <= 8; t++) plan.push({ section: s, part_or_task: t });
      }
      progressState.total = plan.length;
      progressState.done = 0;
      progressState.errors = [];
      updateProgress();

      btn.disabled = true; btn.textContent = '生成中…';

      for (const step of plan) {
        appendLog(`▶ 开始生成 ${step.section} · ${step.part_or_task}`, 'muted');
        try {
          const data = await celpipApi('/admin/generate_one', {
            method: 'POST',
            body: {
              user_id: user.userId,
              paper_id: paperId,
              section: step.section,
              part_or_task: step.part_or_task,
            },
          });
          if (data.ok) {
            progressState.done += 1;
            let extra = '';
            if (data.asset?.audio_key) extra += ` [TTS✓]`;
            if (data.asset?.image_key) extra += ` [Image✓]`;
            if (data.asset?.tts_error) extra += ` [TTS✗ ${data.asset.tts_error.slice(0,40)}]`;
            if (data.asset?.image_error) extra += ` [Image✗ ${data.asset.image_error.slice(0,40)}]`;
            appendLog(`✓ ${step.section}·${step.part_or_task} → item #${data.item_id}${extra}`, 'success');
          } else {
            progressState.errors.push({ step, error: data.error, stage: data.stage });
            appendLog(`✗ ${step.section}·${step.part_or_task} 失败 @${data.stage}: ${data.error}`, 'error');
          }
        } catch (e) {
          progressState.errors.push({ step, error: e.message });
          appendLog(`✗ ${step.section}·${step.part_or_task} 网络错误: ${e.message}`, 'error');
        }
        updateProgress();
      }
      appendLog(`—— 全部完成，共 ${progressState.done}/${progressState.total} 成功 ——`,
                progressState.errors.length ? 'error' : 'success');
      btn.disabled = false; btn.textContent = '一键生成';
      loadPapers();
    }

    // ============== 进度对话框 ==============
    const progressState = { total: 0, done: 0, errors: [] };
    function openProgressModal(paperId, sections) {
      let modal = document.getElementById('progressModal');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'progressModal';
        modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center';
        modal.innerHTML = `
          <div style="background:#FFF;border-radius:12px;padding:24px;max-width:720px;width:92%;max-height:80vh;display:flex;flex-direction:column">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
              <h3 style="color:var(--celpip-primary)">📝 试卷生成进度</h3>
              <button class="celpip-btn secondary small" onclick="closeProgressModal()">关闭</button>
            </div>
            <div style="margin-bottom:12px">
              <div class="celpip-progress-bar" style="height:10px">
                <div id="progressFill" class="celpip-progress-fill" style="background:var(--celpip-primary);width:0%"></div>
              </div>
              <div id="progressText" style="margin-top:6px;font-size:12px;color:var(--celpip-muted)">准备中…</div>
            </div>
            <div id="progressLog" style="flex:1;overflow-y:auto;background:#0F1419;color:#E1E6ED;padding:12px;border-radius:8px;font-family:Menlo,Consolas,monospace;font-size:12px;line-height:1.5;max-height:400px"></div>
          </div>`;
        document.body.appendChild(modal);
      }
      document.getElementById('progressLog').innerHTML = '';
      appendLog(`试卷 #${paperId} · 板块：${sections.join(' / ')}`, 'muted');
    }
    function closeProgressModal() {
      const modal = document.getElementById('progressModal');
      if (modal) modal.remove();
    }
    function updateProgress() {
      const pct = progressState.total > 0 ? Math.round(progressState.done / progressState.total * 100) : 0;
      const fill = document.getElementById('progressFill');
      const txt = document.getElementById('progressText');
      if (fill) fill.style.width = pct + '%';
      if (txt) txt.textContent = `已完成 ${progressState.done} / ${progressState.total} · 失败 ${progressState.errors.length}`;
    }
    function appendLog(msg, level = 'info') {
      const box = document.getElementById('progressLog');
      if (!box) return;
      const color = { success: '#6EE7B7', error: '#FCA5A5', muted: '#94A3B8', info: '#E1E6ED' }[level];
      const t = new Date().toLocaleTimeString();
      box.innerHTML += `<div><span style="color:#64748B">[${t}]</span> <span style="color:${color}">${escapeHtml(msg)}</span></div>`;
      box.scrollTop = box.scrollHeight;
    }
    window.closeProgressModal = closeProgressModal;

    async function setStatus(paperId, status) {
      try {
        await celpipApi('/celpip/papers', {
          method: 'POST',
          body: {
            user_id: user.userId,
            action: status === 'published' ? 'publish' : 'update',
            id: paperId, status,
          },
        });
        loadPapers();
      } catch (e) { alert('状态更新失败：' + e.message); }
    }

    async function deletePaper(paperId) {
      if (!confirm('确认删除该试卷？')) return;
      try {
        await celpipApi('/celpip/papers', {
          method: 'POST',
          body: { user_id: user.userId, action: 'delete', id: paperId },
        });
        loadPapers();
      } catch (e) { alert('删除失败：' + e.message); }
    }

    // ================= AI 配置 =================
    // 按模型类别分区展示（每类独立 endpoint + model）
    const SETTING_GROUPS = [
      {
        title: '① 语言模型 LLM（阅读/写作/口语生成 & 评分）',
        note: '火山方舟：<code>https://ark.cn-beijing.volces.com/api/plan/v3</code>；模型如 <code>ark-code-latest</code>',
        fields: [
          { key: 'llm_endpoint', label: 'LLM Base URL' },
          { key: 'llm_model',    label: 'LLM 模型名 / 接入点 ID' },
        ],
      },
      {
        title: '② 视觉模型 Vision（口语 Task 3/4 图片解析·可选）',
        note: '与 LLM 同 endpoint 即可（<code>/api/plan/v3</code>）',
        fields: [
          { key: 'vision_endpoint', label: 'Vision Base URL' },
          { key: 'vision_model',    label: 'Vision 模型名（可留空）' },
        ],
      },
      {
        title: '③ 文生图 Image（口语 Task 3/4 出图）',
        note: '火山方舟图片生成 Base URL：<code>https://ark.cn-beijing.volces.com/api/plan/v3/images/generations</code>；模型如 <code>doubao-seedream-5.0-lite</code>',
        fields: [
          { key: 'image_endpoint', label: 'Image Base URL' },
          { key: 'image_model',    label: 'Image 模型名' },
        ],
      },
      {
        title: '④ 语音合成 TTS（听力音频生成）',
        note: '二选一 provider。Cloudflare 走 Workers AI；火山走 openspeech 域名（暂未接入 WebSocket 流式）。',
        provider: { key: 'tts_provider', options: [
          { value: 'cloudflare', label: 'Cloudflare Workers AI（推荐）' },
          { value: 'volc',       label: '火山方舟 TTS（seed-tts-2.0）' },
        ]},
        fields: [
          { key: 'cf_tts_model',       label: 'Cloudflare TTS 模型',   showIf: 'cloudflare' },
          { key: 'volc_tts_endpoint',  label: '火山 TTS Base URL',      showIf: 'volc' },
          { key: 'volc_tts_model',     label: '火山 TTS Resource-Id',   showIf: 'volc' },
        ],
      },
      {
        title: '⑤ 语音识别 STT（口语录音转写）',
        note: '二选一 provider。默认 Cloudflare Whisper；火山 STT 为流式 WebSocket，暂未接入。',
        provider: { key: 'stt_provider', options: [
          { value: 'cloudflare', label: 'Cloudflare Whisper（推荐）' },
          { value: 'volc',       label: '火山方舟 STT（volc.seedasr.sauc.duration）' },
        ]},
        fields: [
          { key: 'cf_stt_model',       label: 'Cloudflare STT 模型',   showIf: 'cloudflare' },
          { key: 'volc_stt_endpoint',  label: '火山 STT Base URL',      showIf: 'volc' },
          { key: 'volc_stt_model',     label: '火山 STT Resource-Id',   showIf: 'volc' },
        ],
      },
    ];

    let _settingsCache = {};

    async function loadSettings() {
      try {
        const data = await celpipApi('/admin/settings', { query: { user_id: user.userId } });
        _settingsCache = data.settings || {};
        const secretsHtml = data.secrets?.VOLC_API_KEY
          ? '<div class="celpip-alert success">VOLC_API_KEY：已配置 ✓</div>'
          : '<div class="celpip-alert error">VOLC_API_KEY：未配置 ✗ — 请到 Cloudflare Pages Settings → Environment variables 添加 encrypted 变量</div>';
        document.getElementById('secretStatus').innerHTML = secretsHtml;
        renderSettingsForm();
      } catch (e) {
        document.getElementById('secretStatus').innerHTML = `<div class="celpip-alert error">加载失败：${escapeHtml(e.message)}</div>`;
      }
    }

    function renderSettingsForm() {
      const s = _settingsCache;
      const html = SETTING_GROUPS.map(g => {
        const providerVal = g.provider ? (s[g.provider.key] || g.provider.options[0].value) : null;
        const providerBlock = g.provider ? `
          <div class="form-row">
            <label class="celpip-label">Provider</label>
            <select class="celpip-input" data-key="${g.provider.key}" onchange="renderSettingsForm()">
              ${g.provider.options.map(o =>
                `<option value="${o.value}" ${providerVal === o.value ? 'selected' : ''}>${escapeHtml(o.label)}</option>`).join('')}
            </select>
          </div>` : '';
        const fieldsHtml = g.fields.map(f => {
          if (f.showIf && providerVal !== f.showIf) return '';
          return `
            <div class="form-row">
              <label class="celpip-label">${escapeHtml(f.label)}</label>
              <input class="celpip-input" data-key="${f.key}" value="${escapeAttr(s[f.key] || '')}" placeholder="${escapeAttr(f.label)}">
            </div>`;
        }).join('');
        return `
          <div class="celpip-card" style="margin-bottom:16px">
            <h3 style="margin-bottom:6px">${escapeHtml(g.title)}</h3>
            ${g.note ? `<div style="font-size:12px;color:#5C6773;margin-bottom:12px">${g.note}</div>` : ''}
            ${providerBlock}
            ${fieldsHtml}
          </div>`;
      }).join('');
      document.getElementById('settingsForm').innerHTML = html;
      // 让 provider select 的变化立即在 UI 生效（同步到 cache 再重渲染）
      document.querySelectorAll('#settingsForm select[data-key]').forEach(sel => {
        sel.addEventListener('change', () => {
          _settingsCache[sel.dataset.key] = sel.value;
          // 同步其他输入框当前值到 cache
          document.querySelectorAll('#settingsForm input[data-key]').forEach(inp => {
            _settingsCache[inp.dataset.key] = inp.value;
          });
          renderSettingsForm();
        });
      });
    }
    async function saveSettings() {
      const updates = {};
      document.querySelectorAll('#settingsForm input[data-key]').forEach(inp => {
        updates[inp.dataset.key] = inp.value;
      });
      document.querySelectorAll('#settingsForm select[data-key]').forEach(sel => {
        updates[sel.dataset.key] = sel.value;
      });
      try {
        await celpipApi('/admin/settings', {
          method: 'POST',
          body: { user_id: user.userId, updates },
        });
        alert('已保存');
        loadSettings();
      } catch (e) { alert('保存失败：' + e.message); }
    }

    // ================= 提示词 =================
    const SECTION_LABEL = {
      listening: '听力生成', reading: '阅读生成', writing: '写作生成',
      speaking: '口语生成', scoring: '评分', image: '生图 Prompt',
    };
    async function loadPrompts() {
      const box = document.getElementById('promptsList');
      box.innerHTML = '<div class="celpip-loading"></div>';
      try {
        const data = await celpipApi('/admin/prompts', { query: { user_id: user.userId } });
        const prompts = data.prompts || [];
        const groups = {};
        prompts.forEach(p => (groups[p.section] = groups[p.section] || []).push(p));
        box.innerHTML = Object.keys(groups).map(section => `
          <div style="margin-bottom:24px">
            <h3 style="margin-bottom:12px">${SECTION_LABEL[section] || section} <span style="color:#8A94A6;font-size:12px;font-weight:400">[${section}]</span></h3>
            ${groups[section].map(p => `
              <div class="prompt-card">
                <div style="display:flex;justify-content:space-between;margin-bottom:8px">
                  <b>${escapeHtml(p.name)}</b>
                  <span style="color:#8A94A6;font-size:12px">v${p.version} · ${p.active ? '启用' : '停用'}</span>
                </div>
                <textarea class="textarea" data-id="${p.id}" data-version="${p.version}">${escapeHtml(p.system_prompt)}</textarea>
                <div style="text-align:right;margin-top:8px">
                  <button class="celpip-btn small" onclick="savePrompt(${p.id}, ${p.version}, this)">保存并递增版本</button>
                </div>
              </div>`).join('')}
          </div>`).join('');
      } catch (e) {
        box.innerHTML = `<div class="celpip-alert error">${escapeHtml(e.message)}</div>`;
      }
    }
    async function savePrompt(id, version, btn) {
      const ta = document.querySelector(`textarea[data-id="${id}"]`);
      if (!ta) return;
      btn.disabled = true;
      try {
        await celpipApi('/admin/prompts', {
          method: 'POST',
          body: {
            user_id: user.userId, action: 'update', id,
            system_prompt: ta.value, version: Number(version) + 1,
          },
        });
        alert(`已保存，版本升级到 v${version + 1}`);
        loadPrompts();
      } catch (e) { alert('保存失败：' + e.message); }
      finally { btn.disabled = false; }
    }

    // helpers
    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }
    function escapeAttr(s) { return escapeHtml(s); }
    // 暴露
    window.showTab = showTab;
    window.runMigrate = runMigrate;
    window.createPaper = createPaper;
    window.generateAll = generateAll;
    window.setStatus = setStatus;
    window.deletePaper = deletePaper;
    window.saveSettings = saveSettings;
    window.savePrompt = savePrompt;
    window.renderSettingsForm = renderSettingsForm;
  </script>
</body>
</html>
