<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listening Practice - CELPIP</title>
  <link rel="stylesheet" href="celpip.css">
  <style>
    .listen-layout {
      display: grid;
      grid-template-columns: 1fr 460px;
      gap: 24px;
      align-items: start;
    }
    @media (max-width: 1000px) { .listen-layout { grid-template-columns: 1fr; } }
    .audio-panel, .qa-panel {
      background: #FFF; border: 1px solid var(--celpip-border);
      border-radius: 12px; padding: 20px;
    }
    .audio-status {
      padding: 12px; border-radius: 8px;
      display: flex; align-items: center; gap: 10px;
      font-size: 13px; font-weight: 600;
    }
    .audio-status.idle { background: #F5F7FA; color: #5C6773; }
    .audio-status.playing { background: #EEF4FB; color: #0055A4; }
    .audio-status.done { background: #E7F5EC; color: #145931; }
    .seg-list { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
    .seg-chip {
      padding: 6px 10px; border-radius: 6px;
      background: var(--celpip-surface); font-size: 12px; color: var(--celpip-muted);
    }
    .seg-chip.active { background: #EEF4FB; color: #0055A4; font-weight: 700; }
    .seg-chip.done { background: #E7F5EC; color: #145931; }
    .qa-question { padding: 12px 0; border-bottom: 1px dashed var(--celpip-border); }
    .qa-question:last-child { border-bottom: none; }
    .part-image-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px; margin-top: 12px;
    }
    .part-image-grid img { width: 100%; height: auto; border-radius: 8px; }

    /* 模式选择弹窗 */
    .mode-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center;
      z-index: 999; padding: 20px;
    }
    .mode-modal {
      background: #FFF; border-radius: 16px; max-width: 640px; width: 100%;
      padding: 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .mode-modal h2 { color: #0055A4; margin-bottom: 8px; }
    .mode-modal p.sub { color: #5C6773; margin-bottom: 24px; font-size: 14px; }
    .mode-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .mode-card {
      border: 2px solid var(--celpip-border); border-radius: 12px; padding: 20px;
      cursor: pointer; transition: all 0.2s;
    }
    .mode-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
    .mode-card.practice { border-color: #2E9F5B; }
    .mode-card.exam { border-color: #D64545; }
    .mode-card h3 { margin-bottom: 8px; }
    .mode-card ul { padding-left: 20px; color: #5C6773; font-size: 13px; }
    .mode-card ul li { padding: 2px 0; }
    .listening-placeholder {
      background: #F5F7FA; border-radius: 12px; padding: 60px 20px;
      text-align: center; color: #5C6773;
    }
    .listening-placeholder .icon { font-size: 60px; margin-bottom: 12px; }
    .dropdown-select {
      display: inline-block; padding: 6px 10px; border: 1.5px solid var(--celpip-border);
      border-radius: 8px; font-size: 14px; background: #FFF; min-width: 200px;
      margin: 0 4px;
    }
  </style>
</head>
<body>
  <div class="celpip-container" style="max-width:1200px">
    <div id="msg"></div>
    <div id="app"><div class="celpip-loading"></div></div>
  </div>
  <div id="modeOverlay"></div>

  <script src="celpip.js"></script>
  <script>
    let state = {
      items: [], attempts: [], activeId: null, paperId: null,
      currentSegIdx: 0,
      segmentPlayed: false,
      audioPlayed: false,
      answers: {},
      submitted: false,
      timerId: null,
      timeLeft: 0,
      startedAt: null,
      perQuestionIdx: 0,
      mode: null,               // 必选：'practice' | 'exam'（每次进入板块重新选）
      playRequested: false,
    };

    function replayCurrentAudio() {
      const audio = document.querySelector('.audio-panel audio');
      if (audio) { audio.currentTime = 0; audio.play(); }
    }

    function requestStartPlaying() {
      if (state.playRequested) return;
      state.playRequested = true;
      state.segmentPlayed = false;
      state.audioPlayed = false;
      render();
    }

    (async function main() {
      const user = celpipRequireLogin();
      if (!user) return;
      celpipRenderNav('home');
      const params = new URLSearchParams(location.search);
      state.paperId = params.get('paper_id');
      state.activeId = Number(params.get('item_id'));
      if (!state.paperId || !state.activeId) {
        document.getElementById('msg').innerHTML = '<div class="celpip-alert error">Missing parameters</div>';
        document.getElementById('app').innerHTML = '';
        return;
      }
      try {
        const data = await celpipApi('/celpip/section', {
          query: { paper_id: state.paperId, section: 'listening', user_id: user.userId },
        });
        state.items = data.items || [];
        state.attempts = data.attempts || [];
        // 弹出模式选择
        showModeModal();
      } catch (e) {
        document.getElementById('msg').innerHTML = `<div class="celpip-alert error">Failed to load: ${escapeHtml(e.message)}</div>`;
        document.getElementById('app').innerHTML = '';
      }
    })();

    function showModeModal() {
      const el = document.getElementById('modeOverlay');
      el.innerHTML = `
        <div class="mode-overlay">
          <div class="mode-modal">
            <h2>🎧 Choose Your Mode</h2>
            <p class="sub">Please pick one before starting. This choice locks in for the entire listening session.</p>
            <div class="mode-cards">
              <div class="mode-card practice" onclick="pickMode('practice')">
                <h3 style="color:#2E9F5B">📗 Practice Mode</h3>
                <ul>
                  <li>Manual "Start" button for each audio</li>
                  <li>Full player controls (pause / seek / replay)</li>
                  <li>No per-question timer</li>
                  <li>Free navigation between questions</li>
                  <li>Answers revealed after ALL parts finished</li>
                </ul>
              </div>
              <div class="mode-card exam" onclick="pickMode('exam')">
                <h3 style="color:#D64545">📕 Exam Mode</h3>
                <ul>
                  <li>Audio plays ONCE, no pause / no replay</li>
                  <li>Individual 30s timer (Part 1/2) or shared timer (Part 3-6)</li>
                  <li>No going back to previous questions</li>
                  <li>Real-time submission on timeout / Next</li>
                  <li>Answers revealed only in final Report</li>
                </ul>
              </div>
            </div>
          </div>
        </div>`;
    }

    function pickMode(m) {
      state.mode = m;
      localStorage.setItem('celpip_listen_mode', m);
      document.getElementById('modeOverlay').innerHTML = '';
      loadItem();
    }

    function activeItem() { return state.items.find(i => i.id === state.activeId); }
    function activeIndex() { return state.items.findIndex(i => i.id === state.activeId); }
    function attemptOf(id) { return state.attempts.find(a => a.item_id === id); }

    // 段的题目下标：优先取 question_indices；若缺失则按段长度均分兜底
    function segmentQuestionIndices(segIdx, segments, totalQuestions) {
      const seg = segments[segIdx] || {};
      if (Array.isArray(seg.question_indices) && seg.question_indices.length) {
        return seg.question_indices;
      }
      // 兜底：均匀切分 totalQuestions
      const n = segments.length;
      if (n === 0 || totalQuestions === 0) return [];
      const base = Math.floor(totalQuestions / n);
      const extra = totalQuestions - base * n;
      let start = 0;
      const perSeg = [];
      for (let i = 0; i < n; i++) {
        const size = base + (i < extra ? 1 : 0);
        perSeg.push([...Array(size).keys()].map(k => start + k));
        start += size;
      }
      return perSeg[segIdx] || [];
    }

    function parsedQuestions(it) { return celpipSafeParse(it.questions_json || it.questions, []); }
    function parsedSegments(it)  { return celpipSafeParse(it.segments_json || it.segments, []); }
    function parsedImageKeys(it) { return celpipSafeParse(it.image_keys_json || it.image_keys, []); }
    function partLayout(it)      { return it.part_layout || 'shared_timer'; }
    function questionType(it)    { return it.question_type || 'radio'; }

    function loadItem() {
      if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
      state.currentSegIdx = 0;
      state.segmentPlayed = false;
      state.audioPlayed = false;
      state.answers = {};
      state.submitted = false;
      state.timeLeft = 0;
      state.perQuestionIdx = 0;
      state.startedAt = Date.now();
      state.playRequested = false;
      const at = attemptOf(state.activeId);
      if (at && at.answer_json) {
        const p = celpipSafeParse(at.answer_json, {});
        if (p.answers) {
          state.answers = p.answers;
          state.submitted = true;
          state.audioPlayed = true;
          state.segmentPlayed = true;
          state.playRequested = true;
        }
      }
      render();
    }

    function switchItem(id) {
      const url = new URL(location.href);
      url.searchParams.set('item_id', String(id));
      history.replaceState(null, '', url.toString());
      state.activeId = id;
      loadItem();
    }

    function selectAnswer(qIndex, val) {
      if (state.submitted) return;
      state.answers[qIndex] = val;
      renderQAOnly();
    }

    function renderQAOnly() {
      const qaEl = document.getElementById('qaPanel');
      if (qaEl) qaEl.innerHTML = buildQABody();
    }

    async function submitAll() {
      const it = activeItem();
      if (!it) return;
      state.submitted = true;
      if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
      const used = Math.floor((Date.now() - (state.startedAt || Date.now())) / 1000);
      const suggested = it.shared_timer_seconds || 240;
      const overtime = used > suggested;
      const user = celpipGetUser();
      try {
        await celpipApi('/celpip/attempts', {
          method: 'POST',
          body: {
            user_id: user.userId,
            paper_id: Number(state.paperId),
            section: 'listening',
            item_id: state.activeId,
            answer_json: JSON.stringify({ answers: state.answers, used_seconds: used, suggested_seconds: suggested, overtime, mode: state.mode }),
            status: 'submitted',
          },
        });
        const existed = attemptOf(state.activeId);
        const payload = JSON.stringify({ answers: state.answers, used_seconds: used, suggested_seconds: suggested, overtime, mode: state.mode });
        if (existed) existed.answer_json = payload;
        else state.attempts.push({ item_id: state.activeId, answer_json: payload, status: 'submitted' });
      } catch (e) { console.warn(e.message); }
      // 考试模式：自动跳下一 Part 或跳成绩单
      if (state.mode === 'exam') {
        const idx = activeIndex();
        if (idx < state.items.length - 1) {
          setTimeout(() => switchItem(state.items[idx + 1].id), 300);
          return;
        } else {
          setTimeout(() => location.href = `celpip-report.html?paper_id=${state.paperId}`, 500);
          return;
        }
      }
      render();
    }

    function startSharedTimer(seconds) {
      if (state.timerId) return;
      state.timeLeft = seconds;
      state.timerId = setInterval(() => {
        state.timeLeft -= 1;
        if (state.timeLeft <= 0) {
          clearInterval(state.timerId); state.timerId = null;
          submitAll();
          return;
        }
        const el = document.getElementById('sharedTimer');
        if (el) {
          const m = Math.floor(state.timeLeft / 60), s = state.timeLeft % 60;
          el.textContent = `⏱ ${m}:${String(s).padStart(2, '0')}`;
          if (state.timeLeft <= 30) el.classList.add('warning');
        }
      }, 1000);
    }

    function startPerQuestionTimer(perQSeconds, questionIndices) {
      state.perQuestionIdx = 0;
      state.timeLeft = perQSeconds;
      state.timerId = setInterval(() => {
        state.timeLeft -= 1;
        if (state.timeLeft <= 0) {
          state.perQuestionIdx += 1;
          if (state.perQuestionIdx >= questionIndices.length) {
            clearInterval(state.timerId); state.timerId = null;
            advanceSegment();
            return;
          }
          state.timeLeft = perQSeconds;
          renderQAOnly();
        }
        const el = document.getElementById('perQTimer');
        if (el) {
          el.textContent = `⏱ ${state.timeLeft}s`;
          if (state.timeLeft <= 10) el.classList.add('warning');
          else el.classList.remove('warning');
        }
      }, 1000);
    }

    function advanceSegment() {
      const it = activeItem();
      const segments = parsedSegments(it);
      state.segmentPlayed = false;
      state.currentSegIdx += 1;
      if (state.currentSegIdx >= segments.length) {
        submitAll();
        return;
      }
      render();
    }

    function onAudioEndSegmented() {
      console.log('[onAudioEndSegmented] fired. segIdx=', state.currentSegIdx);
      state.segmentPlayed = true;
      const it = activeItem();
      const segments = parsedSegments(it);
      const questions = parsedQuestions(it);
      console.log('[onAudioEndSegmented] segments=', segments.length, 'questions=', questions.length);
      const qIndices = segmentQuestionIndices(state.currentSegIdx, segments, questions.length);
      console.log('[onAudioEndSegmented] qIndices=', qIndices);
      if (state.mode === 'exam' && qIndices.length) startPerQuestionTimer(30, qIndices);
      updateAudioStatusInline();
      renderQAOnly();
    }
    function onAudioEndFull() {
      console.log('[onAudioEndFull] fired.');
      state.audioPlayed = true;
      state.startedAt = Date.now();
      const it = activeItem();
      if (state.mode === 'exam') startSharedTimer(it.shared_timer_seconds || 240);
      updateAudioStatusInline();
      renderQAOnly();
    }

    // 手动"我听完了"按钮，兜底 onended 不触发的情况
    function manualFinishAudio() {
      const it = activeItem();
      if (!it) return;
      if (partLayout(it) === 'segmented') onAudioEndSegmented();
      else onAudioEndFull();
    }

    function updateAudioStatusInline() {
      const el = document.querySelector('.audio-panel .audio-status');
      if (!el) return;
      const isExam = state.mode === 'exam';
      el.classList.remove('playing', 'idle');
      el.classList.add('done');
      const it = activeItem();
      const layout = it ? partLayout(it) : 'shared_timer';
      if (layout === 'segmented') {
        const segs = parsedSegments(it);
        el.textContent = `🎧 Segment ${state.currentSegIdx + 1} / ${segs.length}` + (isExam ? ' · Finished (no replay in exam mode)' : ' · Finished. Use the player to replay.');
      } else {
        el.textContent = '🎧 ' + (isExam ? 'Finished (no replay in exam mode)' : 'Finished. Use the player to replay.');
      }
    }

    function render() {
      const it = activeItem();
      const app = document.getElementById('app');
      if (!it) { app.innerHTML = '<div class="celpip-alert error">Item not found</div>'; return; }
      const layout = partLayout(it);
      const segments = parsedSegments(it);
      const questions = parsedQuestions(it);
      const imageKeys = parsedImageKeys(it);
      const idx = activeIndex();
      const isExam = state.mode === 'exam';

      // 顶部导航 chip：考试模式禁用（不能跳前后题）
      const navChips = state.items.map((x, i) => {
        const active = x.id === state.activeId;
        const done = !!attemptOf(x.id);
        // 考试模式：只有当前题可点，其他都禁用
        const clickable = !isExam || active;
        const onclick = clickable ? `onclick="switchItem(${x.id})"` : '';
        const style = clickable ? '' : 'style="opacity:0.4;cursor:not-allowed"';
        return `<div class="celpip-nav-chip ${active ? 'active' : ''} ${done ? 'done' : ''}" ${onclick} ${style}>${i + 1}</div>`;
      }).join('');

      // 左侧：音频面板
      let audioBody = '';
      if (!state.playRequested) {
        const modeHint = isExam
          ? '<b style="color:#D64545">Exam mode</b> · once started, no pause, no replay, no going back.'
          : '<b style="color:#2E9F5B">Practice mode</b> · full player controls, no timer.';
        audioBody = `
          <div class="audio-status idle">🎧 Are you ready?</div>
          <div style="text-align:center;padding:32px 20px;background:#F5F7FA;border-radius:12px;margin-top:12px">
            <div style="font-size:14px;color:#5C6773;margin-bottom:16px">${modeHint}</div>
            <button class="celpip-btn" style="font-size:16px;padding:14px 32px" onclick="requestStartPlaying()">
              ▶️ Click to Start
            </button>
          </div>`;
      } else if (layout === 'segmented') {
        const seg = segments[state.currentSegIdx] || {};
        const audioKey = seg.audio_key || it.audio_key;
        const segChips = segments.map((_, i) => `
          <div class="seg-chip ${i === state.currentSegIdx ? 'active' : ''} ${i < state.currentSegIdx ? 'done' : ''}">
            Seg ${i + 1}
          </div>`).join('');
        audioBody = `
          <div class="audio-status ${state.segmentPlayed ? 'done' : 'playing'}">
            🎧 Segment ${state.currentSegIdx + 1} / ${segments.length}
            ${state.segmentPlayed
              ? (isExam ? ' · Finished (no replay in exam mode)' : ' · Finished. Use the player to replay.')
              : ' · Now playing...'}
          </div>
          ${audioKey ? `
            <audio ${isExam ? '' : 'controls'} autoplay
                   src="${celpipAssetUrl(audioKey)}"
                   onended="onAudioEndSegmented()"
                   style="width:100%;margin-top:12px"></audio>
            ${!isExam ? `
              <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
                <button class="celpip-btn secondary small" onclick="replayCurrentAudio()">🔁 Replay Segment</button>
                ${!state.segmentPlayed ? '<button class="celpip-btn small" onclick="manualFinishAudio()">✓ I have Finished Listening</button>' : ''}
              </div>` : ''}
          ` : '<div class="celpip-alert error">Segment audio missing.</div>'}
          <div class="seg-list">${segChips}</div>`;
      } else {
        const audioKey = it.audio_key;
        audioBody = `
          <div class="audio-status ${state.audioPlayed ? 'done' : 'playing'}">
            🎧 ${state.audioPlayed
              ? (isExam ? 'Finished (no replay in exam mode)' : 'Finished. Use the player to replay.')
              : 'Now playing...'}
          </div>
          ${audioKey ? `
            <audio ${isExam ? '' : 'controls'} autoplay
                   src="${celpipAssetUrl(audioKey)}"
                   onended="onAudioEndFull()"
                   style="width:100%;margin-top:12px"></audio>
            ${!isExam ? `
              <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
                <button class="celpip-btn secondary small" onclick="replayCurrentAudio()">🔁 Replay Audio</button>
                ${!state.audioPlayed ? '<button class="celpip-btn small" onclick="manualFinishAudio()">✓ I have Finished Listening</button>' : ''}
              </div>` : ''}
          ` : '<div class="celpip-alert error">Audio missing.</div>'}
          ${imageKeys.length && layout === 'multi_image_shared'
            ? `<div class="part-image-grid">${imageKeys.map(k => `<img src="${celpipAssetUrl(k)}">`).join('')}</div>`
            : (it.image_key ? `<img src="${celpipAssetUrl(it.image_key)}" style="width:100%;border-radius:8px;margin-top:12px">` : '')}`;
      }

      const qaBody = buildQABody();

      const modeBadge = state.mode === 'exam'
        ? '<span style="background:#FBEEEE;color:#D64545;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:700">📕 Exam Mode</span>'
        : '<span style="background:#E7F5EC;color:#2E9F5B;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:700">📗 Practice Mode</span>';

      const prev = idx > 0 ? state.items[idx - 1].id : null;
      const next = idx < state.items.length - 1 ? state.items[idx + 1].id : null;

      // 底部导航：
      //   考试模式：不显示（右侧绿卡自带 Next Part / View Report）
      //   练习模式未提交：Previous / Next Part（用于切题浏览）
      //   练习模式已提交：不显示（右侧绿卡自带 Next Part / View Report）
      let navBottom = '';
      if (isExam) {
        navBottom = '';
      } else if (state.submitted) {
        navBottom = '';
      } else {
        navBottom = (prev ? `<button class="celpip-btn secondary" onclick="switchItem(${prev})">← Previous</button>` : '<span></span>') +
          (next ? `<button class="celpip-btn" onclick="switchItem(${next})">Next Part →</button>` :
                  `<a class="celpip-btn" href="celpip-report.html?paper_id=${state.paperId}">📊 View Report</a>`);
      }

      app.innerHTML = `
        <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px">
          ${isExam ? '' : `<a href="celpip-paper.html?id=${state.paperId}" class="celpip-btn secondary small" style="text-decoration:none">← Back to Paper</a>`}
          <h2 style="color:#0055A4;font-size:20px">Listening · Part ${it.part}${it.title ? ' · ' + escapeHtml(it.title) : ''}</h2>
          <div class="celpip-nav-chips">${navChips}</div>
          ${modeBadge}
        </div>
        <div class="listen-layout">
          <div class="audio-panel">${audioBody}</div>
          <div class="qa-panel" id="qaPanel">${qaBody}</div>
        </div>
        ${navBottom ? `<div style="display:flex;justify-content:space-between;gap:12px;margin-top:24px">${navBottom}</div>` : ''}`;
    }

    // 建构右侧问答面板 - 严格遵守"听时无题"原则
    function buildQABody() {
      const it = activeItem();
      if (!it) return '';
      const layout = partLayout(it);
      const segments = parsedSegments(it);
      const questions = parsedQuestions(it);
      const qType = questionType(it);
      const isExam = state.mode === 'exam';

      // 未开播 -> 空白等待
      if (!state.playRequested) {
        return `<div class="listening-placeholder">
          <div class="icon">🎧</div>
          <div style="font-weight:700;color:#0055A4;margin-bottom:6px">Waiting to start</div>
          <div style="font-size:13px">Click "Start" on the left to begin.</div>
        </div>`;
      }

      // 听时无题
      if (layout === 'segmented') {
        if (!state.segmentPlayed) {
          return `<div class="listening-placeholder">
            <div class="icon">🔊</div>
            <div style="font-weight:700;color:#0055A4;margin-bottom:6px">Listening... please focus</div>
            <div style="font-size:13px">Questions appear after this segment finishes.</div>
          </div>`;
        }
        // 已播完 → 展示题目
        if (state.submitted) {
          // 已提交，不显示对错，只回显选项
          return renderSubmittedNotice();
        }
        const seg = segments[state.currentSegIdx] || {};
        const qIndices = segmentQuestionIndices(state.currentSegIdx, segments, questions.length);
        if (!qIndices.length) {
          const dbgQ = questions.length;
          const dbgS = segments.length;
          const noQ = dbgQ === 0;
          return `<div class="celpip-alert error" style="text-align:left">
            <b>${noQ ? 'No questions in this Part.' : 'Cannot map segment to questions.'}</b><br>
            <span style="font-size:12px">Debug: segments=${dbgS}, questions=${dbgQ}, currentSeg=${state.currentSegIdx}, hasIndices=${!!seg.question_indices}</span><br>
            <span style="font-size:12px;color:#5C6773">
              ${noQ ? 'Please have admin re-generate this Part (transcript exists but questions_json is empty).' : 'Segment lacks question_indices AND fallback failed.'}
            </span>
          </div>`;
        }
        const activeQIdx = qIndices[state.perQuestionIdx];
        return `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <div style="font-weight:700">Segment ${state.currentSegIdx + 1} · Q ${state.perQuestionIdx + 1}/${qIndices.length}</div>
            ${isExam ? `<span class="celpip-timer" id="perQTimer">⏱ ${state.timeLeft}s</span>` : '<span style="font-size:12px;color:#5C6773">Practice · no timer</span>'}
          </div>
          ${renderQuestion(questions[activeQIdx], activeQIdx, state.answers[activeQIdx], false, qType)}
          <div style="margin-top:12px;text-align:right">
            <button class="celpip-btn" ${!state.answers[activeQIdx] ? 'disabled' : ''} onclick="nextInSegment()">
              ${state.perQuestionIdx + 1 < qIndices.length ? 'Next Question →' : (state.currentSegIdx + 1 < segments.length ? 'Next Segment →' : 'Submit Part')}
            </button>
          </div>`;
      }

      // Shared timer 布局：未播完显示占位
      if (!state.audioPlayed) {
        return `<div class="listening-placeholder">
          <div class="icon">🔊</div>
          <div style="font-weight:700;color:#0055A4;margin-bottom:6px">Listening... please focus</div>
          <div style="font-size:13px">All questions appear together after the audio finishes.</div>
        </div>`;
      }
      if (state.submitted) return renderSubmittedNotice();

      const suggested = it.shared_timer_seconds || 240;
      const timerBadge = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div style="font-weight:700">Part ${it.part} · ${questions.length} Questions</div>
          ${isExam ? `<span class="celpip-timer" id="sharedTimer">⏱ ${fmtTime(state.timeLeft || suggested)}</span>` : '<span style="font-size:12px;color:#5C6773">Practice · no timer</span>'}
        </div>`;
      const submitBtn = `
        <div style="margin-top:12px">
          <button class="celpip-btn" style="width:100%" ${Object.keys(state.answers).length < questions.length ? 'disabled' : ''} onclick="submitAll()">
            Submit Part
          </button>
        </div>`;

      // Dropdown 题型：把每题渲成"[N] <select>" 一行一行；Radio 题型：正常选项
      let body;
      if (qType === 'dropdown') {
        body = questions.map((q, i) => renderDropdownQuestion(q, i, state.answers[i])).join('');
      } else {
        body = questions.map((q, i) => `
          <div class="qa-question">${renderQuestion(q, i, state.answers[i], false, qType)}</div>
        `).join('');
      }
      return timerBadge + body + submitBtn;
    }

    function renderSubmittedNotice() {
      const idx = activeIndex();
      const totalParts = state.items.length;
      const doneCount = state.attempts.length;
      return `<div class="listening-placeholder" style="background:#E7F5EC;color:#145931">
        <div class="icon">✓</div>
        <div style="font-weight:700;margin-bottom:6px">Answers submitted for this part.</div>
        <div style="font-size:13px">Progress: ${doneCount}/${totalParts} parts done. Full results (correct/wrong) available on the Report page after finishing all parts.</div>
        ${idx < totalParts - 1
          ? `<button class="celpip-btn" style="margin-top:16px" onclick="switchItem(${state.items[idx + 1].id})">Next Part →</button>`
          : `<a class="celpip-btn" style="margin-top:16px;display:inline-block" href="celpip-report.html?paper_id=${state.paperId}">📊 View Full Report</a>`}
      </div>`;
    }

    function nextInSegment() {
      const it = activeItem();
      const segments = parsedSegments(it);
      const questions = parsedQuestions(it);
      const qIndices = segmentQuestionIndices(state.currentSegIdx, segments, questions.length);
      state.perQuestionIdx += 1;
      if (state.perQuestionIdx >= qIndices.length) {
        if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
        if (state.currentSegIdx + 1 >= segments.length) {
          submitAll();
        } else {
          advanceSegment();
        }
      } else {
        state.timeLeft = 30;
        renderQAOnly();
      }
    }

    // Radio 题型
    function renderQuestion(q, i, chosen, showAnswer, qType) {
      if (!q) return '<div class="celpip-alert error">Question missing.</div>';
      const options = q.options || [];
      const optHtml = options.map((opt, j) => {
        const label = String.fromCharCode(65 + j);
        let cls = 'celpip-option';
        if (chosen && normalize(chosen) === normalize(label)) cls += ' selected';
        if (showAnswer && isCorrectMatch(q.answer, options, label, j, opt)) cls += ' correct';
        if (showAnswer && chosen && !isCorrectMatch(q.answer, options, chosen, -1, null) && normalize(chosen) === normalize(label)) cls += ' wrong';
        return `
          <div class="${cls}" onclick="${showAnswer ? '' : `selectAnswer(${i}, '${label}')`}">
            <div class="celpip-option-label">${label}</div>
            <div class="celpip-option-text">${escapeHtml(opt)}</div>
          </div>`;
      }).join('');
      return `
        <div style="font-size:14px;font-weight:600;margin-bottom:6px">${i + 1}. ${escapeHtml(q.q || q.question || '')}</div>
        ${optHtml}`;
    }

    // Dropdown 题型
    function renderDropdownQuestion(q, i, chosen) {
      if (!q) return '';
      const opts = q.options || [];
      const options = opts.map((opt, j) => {
        const label = String.fromCharCode(65 + j);
        const sel = chosen && normalize(chosen) === normalize(label) ? 'selected' : '';
        return `<option value="${label}" ${sel}>${label}. ${escapeAttr(opt).slice(0, 100)}</option>`;
      }).join('');
      return `
        <div class="qa-question">
          <div style="font-size:14px;font-weight:600;margin-bottom:6px">${i + 1}. ${escapeHtml(q.q || q.question || '')}</div>
          <select class="dropdown-select" onchange="selectAnswer(${i}, this.value)">
            <option value="">-- Choose --</option>
            ${options}
          </select>
        </div>`;
    }

    function fmtTime(s) {
      if (!s || s <= 0) return '0s';
      const m = Math.floor(s / 60);
      return m > 0 ? `${m}:${String(s % 60).padStart(2, '0')}` : `${s}s`;
    }
    function isCorrectMatch(answer, options, chosen, jIdx, optText) {
      if (chosen == null || chosen === '') return false;
      const a = normalize(answer);
      for (let i = 0; i < (options || []).length; i++) {
        const label = String.fromCharCode(65 + i);
        const candA = [normalize(label), normalize(String(i)), normalize(options[i])];
        if (candA.includes(a)) {
          const c = normalize(chosen);
          const candC = [normalize(label), normalize(String(i)), normalize(options[i])];
          return candC.includes(c);
        }
      }
      return normalize(chosen) === a;
    }
    function normalize(v) {
      if (v == null) return '';
      let s = String(v).trim().replace(/^[\s"'\[\]\(\)]+|[\s"'\[\]\(\)]+$/g, '');
      s = s.replace(/^[A-Da-d]\s*[\.\)、:：]\s*/, m => m.trim()[0]);
      if (/^[A-Da-d]$/.test(s)) return s.toUpperCase();
      if (/^\d+$/.test(s)) return s;
      return s.toLowerCase();
    }
    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }
    function escapeAttr(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    window.switchItem = switchItem;
    window.selectAnswer = selectAnswer;
    window.submitAll = submitAll;
    window.onAudioEndSegmented = onAudioEndSegmented;
    window.onAudioEndFull = onAudioEndFull;
    window.nextInSegment = nextInSegment;
    window.replayCurrentAudio = replayCurrentAudio;
    window.requestStartPlaying = requestStartPlaying;
    window.pickMode = pickMode;
    window.manualFinishAudio = manualFinishAudio;
  </script>
</body>
</html>
