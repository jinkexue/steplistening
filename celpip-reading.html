<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阅读练习 - CELPIP</title>
  <link rel="stylesheet" href="celpip.css">
  <style>
    .reading-layout {
      display: grid;
      grid-template-columns: 1fr 420px;
      gap: 24px;
      align-items: start;
    }
    @media (max-width: 960px) {
      .reading-layout { grid-template-columns: 1fr; }
    }
    .passage-box {
      background: #FFF; border: 1px solid var(--celpip-border);
      border-radius: 12px; padding: 24px;
      max-height: calc(100vh - 200px); overflow-y: auto;
      line-height: 1.8; font-size: 15px; color: var(--celpip-text);
    }
    .passage-box h2 { color: var(--celpip-primary); font-size: 20px; margin-bottom: 12px; }
    .passage-box p { margin-bottom: 12px; }
    .qa-box {
      background: #FFF; border: 1px solid var(--celpip-border);
      border-radius: 12px; padding: 20px;
      max-height: calc(100vh - 200px); overflow-y: auto;
    }
    .qa-item { padding-bottom: 16px; border-bottom: 1px dashed var(--celpip-border); margin-bottom: 16px; }
    .qa-item:last-child { border-bottom: none; }
    .qa-question { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--celpip-text); }
    .qa-select {
      width: 100%; padding: 10px 12px; border-radius: 8px;
      border: 1px solid var(--celpip-border); background: #FFF; font-size: 14px;
    }
    .qa-select:disabled { background: var(--celpip-surface); }
    .qa-result-correct { color: var(--celpip-success); font-weight: 700; font-size: 12px; margin-top: 6px; }
    .qa-result-wrong { color: var(--celpip-danger); font-weight: 700; font-size: 12px; margin-top: 6px; }
    .highlight { background: #FFF3CD; padding: 2px 4px; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="celpip-container" style="max-width:1200px">
    <div id="msg"></div>
    <div id="app"><div class="celpip-loading"></div></div>
  </div>

  <script src="celpip.js"></script>
  <script>
    // CELPIP 官方 Reading 每个 Part 建议时间（分钟）
    const READING_MINUTES_BY_PART = { 1: 11, 2: 9, 3: 10, 4: 13 };

    let state = {
      items: [], attempts: [], activeId: null, paperId: null,
      answers: {},  // { qIndex: 'A' }  当前题的选择
      submitted: false,
      explain: null, explaining: false, explainQuestion: null,
    };

    (async function main() {
      const user = celpipRequireLogin();
      if (!user) return;
      celpipRenderNav('home');
      const params = new URLSearchParams(location.search);
      state.paperId = params.get('paper_id');
      state.activeId = Number(params.get('item_id'));
      if (!state.paperId || !state.activeId) {
        document.getElementById('msg').innerHTML = '<div class="celpip-alert error">缺少参数</div>';
        document.getElementById('app').innerHTML = '';
        return;
      }
      try {
        const data = await celpipApi('/celpip/section', {
          query: { paper_id: state.paperId, section: 'reading', user_id: user.userId },
        });
        state.items = data.items || [];
        state.attempts = data.attempts || [];
        loadItem();
      } catch (e) {
        document.getElementById('msg').innerHTML = `<div class="celpip-alert error">加载失败：${escapeHtml(e.message)}</div>`;
        document.getElementById('app').innerHTML = '';
      }
    })();

    function activeItem() { return state.items.find(i => i.id === state.activeId); }
    function activeIndex() { return state.items.findIndex(i => i.id === state.activeId); }
    function attemptOf(id) { return state.attempts.find(a => a.item_id === id); }

    function loadItem() {
      state.answers = {};
      state.submitted = false;
      state.explain = null;
      state.explaining = false;
      state.explainQuestion = null;
      state.startedAt = Date.now();       // 计时开始
      state.usedSeconds = null;
      state.overtime = false;
      const at = attemptOf(state.activeId);
      const parsed = at && at.answer_json ? celpipSafeParse(at.answer_json, {}) : null;
      if (parsed && parsed.answers) {
        state.answers = parsed.answers;
        state.submitted = true;
        if (parsed.used_seconds != null) {
          state.usedSeconds = parsed.used_seconds;
          state.overtime = !!parsed.overtime;
        }
      }
      render();
    }

    function switchItem(id) {
      const url = new URL(location.href);
      url.searchParams.set('item_id', String(id));
      history.replaceState(null, '', url.toString());
      state.activeId = id;
      loadItem();
    }

    function selectAnswer(qIndex, value) {
      if (state.submitted) return;
      state.answers[qIndex] = value;
      render();
    }

    async function submitAll() {
      const it = activeItem();
      if (!it) return;
      state.submitted = true;
      const suggested = (READING_MINUTES_BY_PART[it.part] || 10) * 60;
      state.usedSeconds = Math.floor((Date.now() - (state.startedAt || Date.now())) / 1000);
      state.overtime = state.usedSeconds > suggested;
      const user = celpipGetUser();
      try {
        await celpipApi('/celpip/attempts', {
          method: 'POST',
          body: {
            user_id: user.userId,
            paper_id: Number(state.paperId),
            section: 'reading',
            item_id: state.activeId,
            answer_json: JSON.stringify({
              answers: state.answers,
              used_seconds: state.usedSeconds,
              suggested_seconds: suggested,
              overtime: state.overtime,
            }),
            status: 'submitted',
          },
        });
        const existed = attemptOf(state.activeId);
        const payload = JSON.stringify({
          answers: state.answers,
          used_seconds: state.usedSeconds,
          suggested_seconds: suggested,
          overtime: state.overtime,
        });
        if (existed) existed.answer_json = payload;
        else state.attempts.push({ item_id: state.activeId, answer_json: payload, status: 'submitted' });
      } catch (e) { console.warn(e.message); }
      render();
    }

    async function requestExplain(qIndex) {
      const user = celpipGetUser();
      state.explaining = true;
      state.explainQuestion = qIndex;
      render();
      try {
        const data = await celpipApi('/celpip/reading/explain', {
          method: 'POST',
          body: {
            user_id: user.userId,
            item_id: state.activeId,
            question_index: qIndex,
            wrong_option: state.answers[qIndex],
          },
        });
        state.explain = data.result;
      } catch (e) {
        alert('AI 解析失败：' + e.message);
      } finally {
        state.explaining = false;
        render();
      }
    }

    function render() {
      const it = activeItem();
      const app = document.getElementById('app');
      if (!it) { app.innerHTML = '<div class="celpip-alert error">找不到该题</div>'; return; }

      const questions = celpipSafeParse(it.questions, []);
      const idx = activeIndex();
      const totalItems = state.items.length;

      const navChips = state.items.map((x, i) => `
        <div class="celpip-nav-chip ${x.id === state.activeId ? 'active' : ''} ${attemptOf(x.id) ? 'done' : ''}"
             onclick="switchItem(${x.id})">${i + 1}</div>`).join('');

      // 左侧：文章
      const paraGistHighlight = state.explain && Array.isArray(state.explain.para_gist)
        ? renderParaGist(it.passage, state.explain.para_gist, state.explain.locator_sentence)
        : escapeHtml(it.passage || '').replace(/\n\n+/g, '</p><p>').replace(/\n/g, '<br>');

      const leftHtml = `
        <div class="passage-box">
          ${it.title ? `<h2>${escapeHtml(it.title)}</h2>` : ''}
          <p>${paraGistHighlight}</p>
        </div>`;

      // 右侧：题目
      const qHtml = questions.map((q, i) => {
        const qText = q.q || q.question || '';
        const options = q.options || [];
        const userAns = state.answers[i];
        let resultBlock = '';
        if (state.submitted) {
          const correct = normalize(q.answer);
          const isCorrect = normalize(userAns) === correct;
          resultBlock = isCorrect
            ? `<div class="qa-result-correct">✓ 正确</div>`
            : `<div class="qa-result-wrong">✗ 错误，正确答案：${escapeHtml(String(q.answer))}</div>`;
        }
        return `
          <div class="qa-item">
            <div class="qa-question">${i + 1}. ${escapeHtml(qText)}</div>
            <select class="qa-select" ${state.submitted ? 'disabled' : ''} onchange="selectAnswer(${i}, this.value)">
              <option value="">-- 请选择 --</option>
              ${options.map((opt, j) => {
                const label = String.fromCharCode(65 + j);
                return `<option value="${escapeAttr(label)}" ${userAns === label ? 'selected' : ''}>${label}. ${escapeHtml(opt)}</option>`;
              }).join('')}
            </select>
            ${resultBlock}
            ${state.submitted ? `
              <button class="celpip-btn secondary small" style="margin-top:8px" onclick="requestExplain(${i})">
                🤖 AI 求助（大意 / 定位句 / 错项）
              </button>` : ''}
          </div>`;
      }).join('');

      const allAnswered = questions.every((q, i) => state.answers[i]);
      const submitBlock = state.submitted ? '' : `
        <button class="celpip-btn" style="width:100%;margin-top:12px" ${!allAnswered ? 'disabled' : ''} onclick="submitAll()">
          提交全部答案
        </button>`;

      const explainBlock = state.explain ? renderExplain(state.explain) : (state.explaining ? '<div style="text-align:center;margin-top:12px"><div class="celpip-loading"></div></div>' : '');

      const rightHtml = `
        <div class="qa-box">
          <h3 style="color:var(--celpip-primary);margin-bottom:16px">Reading · Part ${it.part}</h3>
          ${qHtml}
          ${submitBlock}
          ${explainBlock}
        </div>`;

      const prev = idx > 0 ? state.items[idx - 1].id : null;
      const next = idx < totalItems - 1 ? state.items[idx + 1].id : null;

      app.innerHTML = `
        <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px">
          <a href="celpip-paper.html?id=${state.paperId}" class="celpip-btn secondary small" style="text-decoration:none">← 返回试卷</a>
          <h2 style="color:var(--celpip-primary);font-size:20px">Reading Part ${it.part}</h2>
          <div class="celpip-nav-chips">${navChips}</div>
          ${renderTimeBadge(it)}
        </div>
        <div class="reading-layout">${leftHtml}${rightHtml}</div>
        <div style="display:flex;justify-content:space-between;gap:12px;margin-top:24px">
          ${prev ? `<button class="celpip-btn secondary" onclick="switchItem(${prev})">← 上一题</button>` : '<span></span>'}
          ${next ? `<button class="celpip-btn" onclick="switchItem(${next})">下一题 →</button>` :
                   (state.submitted ? `<a class="celpip-btn" href="celpip-paper.html?id=${state.paperId}">返回试卷</a>` : '<span></span>')}
        </div>`;
    }

    function renderTimeBadge(it) {
      const suggested = (READING_MINUTES_BY_PART[it.part] || 10) * 60;
      const suggestedMin = Math.round(suggested / 60);
      if (state.submitted && state.usedSeconds != null) {
        const used = state.usedSeconds;
        const usedTxt = used >= 60 ? `${Math.floor(used / 60)}m${used % 60}s` : `${used}s`;
        if (state.overtime) {
          return `<div style="display:inline-flex;align-items:center;gap:6px;background:#FBEEEE;color:#D64545;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:700">⏰ 超时 · 用时 ${usedTxt} / 建议 ${suggestedMin}m</div>`;
        }
        return `<div style="display:inline-flex;align-items:center;gap:6px;background:#E7F5EC;color:#2E9F5B;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:700">⏱ 用时 ${usedTxt} / 建议 ${suggestedMin}m</div>`;
      }
      return `<div style="display:inline-flex;align-items:center;gap:6px;background:#EEF4FB;color:#0055A4;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:700">💡 建议 ${suggestedMin} 分钟</div>`;
    }

    function renderParaGist(passage, gists, locator) {
      // 按段落分割，为每段添加大意 tooltip；locator 句加高亮
      const paragraphs = String(passage || '').split(/\n\n+/);
      return paragraphs.map((p, i) => {
        let html = escapeHtml(p).replace(/\n/g, '<br>');
        if (locator) {
          const esc = escapeHtml(locator);
          if (html.includes(esc)) html = html.replace(esc, `<span class="highlight">${esc}</span>`);
        }
        const gist = gists.find(g => g.paragraph_index === i);
        if (gist) {
          html += `<div style="margin-top:4px;font-size:12px;color:var(--celpip-primary)">💡 ${escapeHtml(gist.gist)}</div>`;
        }
        return `<div style="margin-bottom:16px">${html}</div>`;
      }).join('');
    }

    function renderExplain(p) {
      const parts = ['<div style="margin-top:16px;padding:12px;background:#F5F7FA;border-radius:8px">'];
      if (p.summary) parts.push(`<div class="celpip-paraphrase-header">全文大意</div><div class="celpip-paraphrase-text">${escapeHtml(p.summary)}</div>`);
      if (p.locator_sentence) parts.push(`<div class="celpip-paraphrase-header">定位句</div><div class="celpip-paraphrase-text" style="background:#FFF3CD;padding:6px;border-radius:4px">${escapeHtml(p.locator_sentence)}</div>`);
      if (p.why_wrong) parts.push(`<div class="celpip-paraphrase-header">为什么你的选项不对</div><div class="celpip-paraphrase-text">${escapeHtml(p.why_wrong)}</div>`);
      if (p.why_right) parts.push(`<div class="celpip-paraphrase-header">为什么正确答案对</div><div class="celpip-paraphrase-text">${escapeHtml(p.why_right)}</div>`);
      if (Array.isArray(p.key_vocab) && p.key_vocab.length) {
        parts.push(`<div class="celpip-paraphrase-header">关键词</div>`);
        p.key_vocab.forEach(v => parts.push(`<div class="celpip-paraphrase-text">• <b>${escapeHtml(v.word || '')}</b> — ${escapeHtml(v.meaning_zh || '')}${v.example ? '<br>&nbsp;&nbsp;e.g. ' + escapeHtml(v.example) : ''}</div>`));
      }
      parts.push('</div>');
      return parts.join('');
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }
    function escapeAttr(s) { return escapeHtml(s); }
    function normalize(v) {
      if (v == null) return '';
      let s = String(v).trim().replace(/^[\s"'\[\]\(\)]+|[\s"'\[\]\(\)]+$/g, '');
      s = s.replace(/^[A-Da-d]\s*[\.\)、:：]\s*/, m => m.trim()[0]);
      if (/^[A-Da-d]$/.test(s)) return s.toUpperCase();
      if (/^\d+$/.test(s)) return s;
      return s.toLowerCase();
    }

    window.switchItem = switchItem;
    window.selectAnswer = selectAnswer;
    window.submitAll = submitAll;
    window.requestExplain = requestExplain;
  </script>
</body>
</html>
