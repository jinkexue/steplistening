<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paper Details - CELPIP</title>
  <link rel="stylesheet" href="celpip.css">
</head>
<body>
  <div class="celpip-container">
    <div id="header"></div>
    <div id="msg"></div>
    <div id="content"><div class="celpip-loading"></div></div>
  </div>

  <script src="celpip.js"></script>
  <script>
    // CELPIP 官方考试顺序：Listening → Reading → Writing → Speaking
    const SECTIONS = [
      { key: 'listening', label: '🎧 Listening', desc: '6 Parts · Canadian accent · Per-question countdown', icon: '🎧' },
      { key: 'reading',   label: '📖 Reading',   desc: '4 Parts · Split layout · Drop-down questions',       icon: '📖' },
      { key: 'writing',   label: '✍️ Writing',   desc: '2 Tasks · CLB 4-dimension scoring · AI sample',       icon: '✍️' },
      { key: 'speaking',  label: '🗣️ Speaking',  desc: '8 Tasks · Images included · Prep + Recording',       icon: '🗣️' },
    ];
    const SECTION_COLOR = {
      listening: '#3F84C7', reading: '#2E9F5B', writing: '#F5A623', speaking: '#A55BD6',
    };

    (async function main() {
      const user = celpipRequireLogin();
      if (!user) return;
      celpipRenderNav('home');

      const params = new URLSearchParams(location.search);
      const paperId = params.get('id');
      if (!paperId) {
        document.getElementById('msg').innerHTML = '<div class="celpip-alert error">Missing paper id parameter</div>';
        document.getElementById('content').innerHTML = '';
        return;
      }

      try {
        // 试卷 + counts
        const paperResp = await celpipApi('/celpip/papers', { query: { id: paperId } });
        const paper = paperResp.paper;
        const counts = paperResp.counts || {};

        // 并发获取 4 个 section 的 items[0] 和 attempts
        const sectionData = await Promise.all(SECTIONS.map(async s => {
          try {
            const r = await celpipApi('/celpip/section', {
              query: { paper_id: paperId, section: s.key, user_id: user.userId },
            });
            return {
              key: s.key,
              firstId: r.items && r.items[0] ? r.items[0].id : null,
              done: (r.attempts || []).length,
              total: (r.items || []).length,
            };
          } catch { return { key: s.key, firstId: null, done: 0, total: counts[s.key] || 0 }; }
        }));
        const bySec = Object.fromEntries(sectionData.map(d => [d.key, d]));

        document.getElementById('header').innerHTML = `
          <div class="celpip-hero">
            <div style="flex:1">
              <h1>${escapeHtml(paper.title)}</h1>
              <div style="display:flex;gap:12px;align-items:center;margin-top:6px">
                <span class="celpip-badge">${escapeHtml(paper.difficulty)}</span>
                <span style="color:#5C6773;font-size:13px">Status: ${paper.status === 'published' ? 'Published' : 'Draft'}</span>
              </div>
            </div>
            <a class="celpip-btn secondary" href="celpip-report.html?paper_id=${paperId}">📊 View Report</a>
          </div>`;

        document.getElementById('content').innerHTML = `
          <div class="celpip-grid">${SECTIONS.map(s => {
            const d = bySec[s.key] || { firstId: null, done: 0, total: counts[s.key] || 0 };
            const pct = d.total > 0 ? Math.min(100, Math.round((d.done / d.total) * 100)) : 0;
            const disabled = !d.firstId;
            const target = disabled ? '' : `celpip-${s.key}.html?paper_id=${paperId}&item_id=${d.firstId}`;
            return `
              <div class="celpip-section-card"
                   data-section="${s.key}"
                   data-disabled="${disabled ? '1' : '0'}"
                   data-target="${escapeAttr(target)}"
                   style="border-top-color:${SECTION_COLOR[s.key]};${disabled ? 'opacity:0.6;cursor:not-allowed' : ''}">
                <div class="celpip-section-icon">${s.icon}</div>
                <div class="celpip-section-title">${s.label}</div>
                <div class="celpip-section-desc">${s.desc}</div>
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
                  <div class="celpip-progress-bar" style="flex:1">
                    <div class="celpip-progress-fill" style="width:${pct}%;background:${SECTION_COLOR[s.key]}"></div>
                  </div>
                  <span style="font-size:11px;font-weight:700;color:#8A94A6">${d.done}/${d.total}</span>
                </div>
                <div style="color:#0055A4;font-weight:600">${d.done > 0 ? 'Continue →' : 'Start Practice →'}</div>
              </div>`;
          }).join('')}</div>`;

        // 绑定点击事件（避免内联 onclick 的引号地狱导致 SyntaxError）
        document.querySelectorAll('.celpip-section-card[data-section]').forEach(card => {
          card.addEventListener('click', () => {
            if (card.dataset.disabled === '1') {
              alert("No items yet in this section. Please ask the admin to generate items from the backend.");
            } else if (card.dataset.target) {
              location.href = card.dataset.target;
            }
          });
        });
      } catch (e) {
        document.getElementById('msg').innerHTML = `<div class="celpip-alert error">Failed to load: ${escapeHtml(e.message)}</div>`;
        document.getElementById('content').innerHTML = '';
      }
    })();

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }
    function escapeAttr(s) { return escapeHtml(s); }
  </script>
</body>
</html>
