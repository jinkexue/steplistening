name = "steplistening"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[env.production]
vars = { ENVIRONMENT = "production" }

# 请将 YOUR_DATABASE_ID_HERE 替换为实际的 database_id
# 获取方式：运行 wrangler d1 create dictation_db
[[d1_databases]]
binding = "DB"
database_name = "dictation_db"
database_id = "YOUR_DATABASE_ID_HERE"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "dictation-audio"

[build]
command = "npm run build"
cwd = "."
